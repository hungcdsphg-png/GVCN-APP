        window.initKeoCoKien = function() {
            const container = document.getElementById('game-mount-point');
            if(!container) return;

            // 1. Khởi tạo State mặc định cho Kéo co kiến nếu chưa có
            if (!state.keoCoGame) {
                state.keoCoGame = {
                    view: 'config', // 'config' hoặc 'play'
                    settings: {
                        title: "Ôn tập số có 3 chữ số",
                        timeLimit: "90",
                        pointsToWin: 7,
                        freezeTime: "3",
                        team1Name: "Đội Xanh",
                        team2Name: "Đội Đỏ",
                        gameType: "keoco",
                        playMode: "default",
                        controlMethod: "keyboard",
                        questionOrder: "random",
                        dontShuffleAnswers: false,
                        endOnOutOfQuestions: false,
                        questionFontSize: "normal",
                        optionFontSize: "normal",
                        soundEnabled: true
                    },
                    questions: [
                        { 
                            id: 1, 
                            text: "Số thích hợp để điền vào chỗ chấm: 20 dm = .... m", 
                            options: [
                                { text: "2", isCorrect: true },
                                { text: "20", isCorrect: false },
                                { text: "120", isCorrect: false },
                                { text: "200", isCorrect: false }
                            ]
                        }
                    ],
                    questionLibrary: []
                };
            }

            if (!state.keoCoGame.questionLibrary) {
                state.keoCoGame.questionLibrary = [];
            }

            const kState = state.keoCoGame;

            // Các hàm xử lý sự kiện nội bộ
            window.updateKeoCoSetting = (key, value, type = 'string') => { 
                kState.settings[key] = type === 'boolean' ? value : value; 
                if(type === 'radio' || type === 'checkbox' || type === 'select') {
                    window.initKeoCoKien(); 
                }
            };
            
            window.handleAnswer = (teamNum, optionIndex) => {
                if (kState.view !== 'play') return;
                const p = kState.play;
                if (!p || p.status !== 'playing') return;

                const team = teamNum === 1 ? p.team1 : p.team2;
                const teamQuestions = teamNum === 1 ? p.team1Questions : p.team2Questions;
                const currentQ = teamQuestions[team.questionIndex];

                if (!currentQ) return;

                // Kiểm tra đội có đang bị đóng băng không
                const now = Date.now();
                if (team.freezeUntil > now) return;

                const selectedOption = currentQ.options[optionIndex];
                if (!selectedOption) return;

                if (selectedOption.isCorrect) {
                    team.score += 1;
                    if (teamNum === 1) {
                        p.ropeOffset -= 1; // Kéo sang trái (Đội 1)
                    } else {
                        p.ropeOffset += 1; // Kéo sang phải (Đội 2)
                    }

                    // Chuyển câu hỏi tiếp theo
                    team.questionIndex += 1;
                    if (team.questionIndex >= teamQuestions.length) {
                        if (kState.settings.endOnOutOfQuestions) {
                            team.outOfQuestions = true;
                        } else {
                            team.questionIndex = 0; // Lặp lại câu hỏi nếu hết
                        }
                    }

                    // Kiểm tra điều kiện thắng
                    const winPoints = parseInt(kState.settings.pointsToWin) || 7;
                    if (kState.settings.playMode === 'milestone') {
                        if (team.score >= winPoints) {
                            p.status = 'finished';
                            if (window.keocoInterval) clearInterval(window.keocoInterval);
                        }
                    } else {
                        if (Math.abs(p.ropeOffset) >= winPoints) {
                            p.status = 'finished';
                            if (window.keocoInterval) clearInterval(window.keocoInterval);
                        }
                    }

                    if (kState.settings.endOnOutOfQuestions && p.team1.outOfQuestions && p.team2.outOfQuestions) {
                        p.status = 'finished';
                        if (window.keocoInterval) clearInterval(window.keocoInterval);
                    }
                } else {
                    // Trả lời sai -> Đóng băng đội trong khoảng thời gian cấu hình
                    const freezeSec = parseInt(kState.settings.freezeTime) || 3;
                    team.freezeUntil = Date.now() + (freezeSec * 1000);
                }

                window.initKeoCoKien();
            };

            window.updateKeoCoLogic = () => {
                if (kState.view !== 'play') return;
                const p = kState.play;
                if (!p || p.status !== 'playing') return;

                p.timer -= 1;

                // Cập nhật số giây đếm ngược trực tiếp để không làm nháy lại toàn bộ giao diện HTML
                const timerElem = document.getElementById('keoco-timer-text');
                if (timerElem) {
                    const m = Math.floor(p.timer / 60);
                    const s = p.timer % 60;
                    timerElem.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                }

                if (p.timer <= 0) {
                    p.timer = 0;
                    p.status = 'finished';
                    if (window.keocoInterval) clearInterval(window.keocoInterval);
                    window.initKeoCoKien();
                    return;
                }

                const now = Date.now();
                const t1Frozen = p.team1.freezeUntil > now;
                const t2Frozen = p.team2.freezeUntil > now;

                // Chỉ vẽ lại giao diện khi trạng thái đóng băng thay đổi
                if (p.team1.wasFrozen !== t1Frozen || p.team2.wasFrozen !== t2Frozen) {
                    p.team1.wasFrozen = t1Frozen;
                    p.team2.wasFrozen = t2Frozen;
                    window.initKeoCoKien();
                }
            };

            window.handleKeoCoKeyPress = (e) => {
                if (kState.view !== 'play') return;
                const p = kState.play;
                if (!p || p.status !== 'playing') return;

                if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

                const key = e.key.toUpperCase();
                // Phím bấm Đội 1: Q (0), W (1), A (2), S (3)
                if (key === 'Q') window.handleAnswer(1, 0);
                else if (key === 'W') window.handleAnswer(1, 1);
                else if (key === 'A') window.handleAnswer(1, 2);
                else if (key === 'S') window.handleAnswer(1, 3);

                // Phím bấm Đội 2: O (0), P (1), K (2), L (3)
                else if (key === 'O') window.handleAnswer(2, 0);
                else if (key === 'P') window.handleAnswer(2, 1);
                else if (key === 'K') window.handleAnswer(2, 2);
                else if (key === 'L') window.handleAnswer(2, 3);
            };

            window.openKeoCoExcelImportModal = () => {
                const modalHtml = `
                    <div class="fixed inset-0 bg-slate-900/70 z-[100] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" id="keoco-excel-modal">
                        <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-lg overflow-hidden flex flex-col">
                            <div class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white p-6 flex justify-between items-center">
                                <h3 class="font-black text-xl flex items-center gap-2"><i class="ph-fill ph-file-xls text-2xl"></i> NHẬP CÂU HỎI TỪ EXCEL</h3>
                                <button onclick="closeModal('keoco-excel-modal')" class="bg-white/10 p-2 rounded-full hover:bg-white/20 transition-colors"><i class="ph-bold ph-x text-lg"></i></button>
                            </div>
                            <div class="p-6 bg-slate-50 space-y-4 text-left">
                                <p class="text-xs text-slate-500">File Excel gồm các cột: <strong>Câu hỏi | Đáp án 1 | Đáp án 2 | Đáp án 3 | Đáp án 4 | Cột đáp án đúng (1, 2, 3 hoặc 4)</strong></p>
                                <div class="border-2 border-dashed border-emerald-300 rounded-2xl p-6 bg-emerald-50/50 hover:bg-emerald-50 transition-colors cursor-pointer text-center" onclick="document.getElementById('keoco-excel-file').click()">
                                    <input type="file" id="keoco-excel-file" accept=".xlsx, .xls, .csv" class="hidden" onchange="processKeoCoExcel(event)">
                                    <i class="ph-fill ph-upload-simple text-4xl text-emerald-600 mb-2 block"></i>
                                    <div class="text-sm font-bold text-slate-700">Tải file Excel lên</div>
                                </div>
                                <div class="text-center font-bold text-xs text-slate-400 uppercase my-2">- Hoặc dán dữ liệu dạng bảng -</div>
                                <textarea id="keoco-paste-area" rows="4" placeholder="Câu hỏi 1	Đáp án A	Đáp án B	Đáp án C	Đáp án D	1" class="w-full p-3 border border-slate-300 rounded-xl text-xs outline-none focus:border-emerald-500 font-mono"></textarea>
                                <button onclick="processKeoCoTextPaste()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition-all text-sm">Thêm từ dữ liệu đã dán</button>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('modal-container').innerHTML = modalHtml;
            };

            window.processKeoCoExcel = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const workbook = XLSX.read(evt.target.result, { type: 'binary' });
                        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                        parseKeoCoRows(rows);
                    } catch (err) {
                        showToast("Lỗi đọc file Excel!", "error");
                    }
                };
                reader.readAsBinaryString(file);
            };

            window.processKeoCoTextPaste = () => {
                const text = document.getElementById('keoco-paste-area')?.value.trim();
                if (!text) return showToast("Vui lòng dán dữ liệu!", "error");
                const rows = text.split('\n').map(row => row.split('\t'));
                parseKeoCoRows(rows);
            };

            const parseKeoCoRows = (rows) => {
                let added = 0;
                rows.forEach((r) => {
                    if (r.length < 5) return;
                    const qText = (r[0] || '').toString().trim();
                    if (!qText || qText.toLowerCase().includes('câu hỏi')) return;
                    const opt1 = (r[1] || '').toString().trim();
                    const opt2 = (r[2] || '').toString().trim();
                    const opt3 = (r[3] || '').toString().trim();
                    const opt4 = (r[4] || '').toString().trim();
                    let correctIdx = parseInt(r[5]) - 1;
                    if (isNaN(correctIdx) || correctIdx < 0 || correctIdx > 3) correctIdx = 0;

                    if (qText && opt1) {
                        kState.questions.push({
                            id: Date.now() + Math.random(),
                            text: qText,
                            options: [
                                { text: opt1 || 'A', isCorrect: correctIdx === 0 },
                                { text: opt2 || 'B', isCorrect: correctIdx === 1 },
                                { text: opt3 || 'C', isCorrect: correctIdx === 2 },
                                { text: opt4 || 'D', isCorrect: correctIdx === 3 }
                            ]
                        });
                        added++;
                    }
                });
                closeModal('keoco-excel-modal');
                saveData();
                window.initKeoCoKien();
                showToast(`Đã thêm ${added} câu hỏi!`, "success");
            };

            window.openKeoCoPresetModal = () => {
                const presets = [
                    {
                        name: "Toán 3 - Số có 3 chữ số",
                        desc: "Ôn tập đọc, viết, so sánh số có 3 chữ số",
                        questions: [
                            { text: "Số thích hợp điền vào chỗ chấm: 20 dm = .... m", options: [{ text: "2", isCorrect: true }, { text: "20", isCorrect: false }, { text: "120", isCorrect: false }, { text: "200", isCorrect: false }] },
                            { text: "Mét được viết tắt là gì?", options: [{ text: "m", isCorrect: true }, { text: "cm", isCorrect: false }, { text: "dm", isCorrect: false }, { text: "mm", isCorrect: false }] },
                            { text: "Số thích hợp điền vào chỗ chấm: 4 dm = .... cm", options: [{ text: "40", isCorrect: true }, { text: "4", isCorrect: false }, { text: "400", isCorrect: false }, { text: "14", isCorrect: false }] },
                            { text: "Số gồm 5 trăm, 0 chục, 3 đơn vị viết là:", options: [{ text: "503", isCorrect: true }, { text: "530", isCorrect: false }, { text: "305", isCorrect: false }, { text: "53", isCorrect: false }] },
                            { text: "Số lớn nhất có 3 chữ số khác nhau là:", options: [{ text: "987", isCorrect: true }, { text: "999", isCorrect: false }, { text: "989", isCorrect: false }, { text: "100", isCorrect: false }] }
                        ]
                    },
                    {
                        name: "Tiếng Việt 3 - Từ chỉ hoạt động",
                        desc: "Từ chỉ hoạt động, trạng thái và câu cảm",
                        questions: [
                            { text: "Từ nào sau đây chỉ hoạt động của học sinh?", options: [{ text: "Đọc sách", isCorrect: true }, { text: "Xinh đẹp", isCorrect: false }, { text: "Thông minh", isCorrect: false }, { text: "Cần cù", isCorrect: false }] },
                            { text: "Câu nào dưới đây là câu cảm?", options: [{ text: "Bông hoa này đẹp quá!", isCorrect: true }, { text: "Bạn đang làm gì đấy?", isCorrect: false }, { text: "Em hãy học bài đi.", isCorrect: false }, { text: "Mặt trời mọc ở đằng đông.", isCorrect: false }] },
                            { text: "Từ trái nghĩa với 'chăm chỉ' là:", options: [{ text: "Lười biếng", isCorrect: true }, { text: "Cần cù", isCorrect: false }, { text: "Ngoan ngoãn", isCorrect: false }, { text: "Hiền lành", isCorrect: false }] }
                        ]
                    }
                ];

                const modalHtml = `
                    <div class="fixed inset-0 bg-slate-900/70 z-[100] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" id="keoco-preset-modal">
                        <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-lg overflow-hidden flex flex-col">
                            <div class="bg-teal-700 text-white p-6 flex justify-between items-center">
                                <h3 class="font-black text-xl flex items-center gap-2"><i class="ph-fill ph-folder-open text-2xl"></i> CHỌN TỪ BÀI CÓ SẴN</h3>
                                <button onclick="closeModal('keoco-preset-modal')" class="bg-white/10 p-2 rounded-full hover:bg-white/20 transition-colors"><i class="ph-bold ph-x text-lg"></i></button>
                            </div>
                            <div class="p-6 bg-slate-50 space-y-3 text-left max-h-[60vh] overflow-y-auto custom-scrollbar">
                                ${presets.map((preset, idx) => `
                                    <div class="p-4 bg-white rounded-2xl border border-slate-200 hover:border-teal-500 hover:shadow-md transition-all flex justify-between items-center">
                                        <div>
                                            <div class="font-bold text-slate-800 text-sm">${preset.name}</div>
                                            <div class="text-xs text-slate-500 mt-1">${preset.desc} (${preset.questions.length} câu)</div>
                                        </div>
                                        <button onclick="applyKeoCoPreset(${idx})" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-xs transition-colors shadow-sm">Tải bài này</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('modal-container').innerHTML = modalHtml;

                window.applyKeoCoPreset = (idx) => {
                    const preset = presets[idx];
                    if (!preset) return;
                    kState.questions = preset.questions.map(q => ({
                        id: Date.now() + Math.random(),
                        text: q.text,
                        options: q.options
                    }));
                    closeModal('keoco-preset-modal');
                    saveData();
                    window.initKeoCoKien();
                    showToast(`Đã nạp bộ đề "${preset.name}"!`, "success");
                };
            };

            window.startKeoCoGame = () => { 
                const activeQuestions = kState.questions.filter(q => !q.isDeleted);
                if (activeQuestions.length === 0) return showToast("Vui lòng thêm hoặc khôi phục ít nhất 1 câu hỏi để bắt đầu!", "error");
                kState.view = 'play'; 
                kState.play = {
                    timer: parseInt(kState.settings.timeLimit),
                    team1: { score: 0, questionIndex: 0, freezeUntil: 0 },
                    team2: { score: 0, questionIndex: 0, freezeUntil: 0 },
                    ropeOffset: 0,
                    status: 'playing'
                };
                
                // Chuẩn bị bộ câu hỏi cho 2 đội (chỉ sử dụng các câu hỏi chưa bị xóa)
                if (kState.settings.questionOrder === 'random') {
                    kState.play.team1Questions = JSON.parse(JSON.stringify(activeQuestions)).sort(() => 0.5 - Math.random());
                    kState.play.team2Questions = JSON.parse(JSON.stringify(activeQuestions)).sort(() => 0.5 - Math.random());
                } else {
                    kState.play.team1Questions = JSON.parse(JSON.stringify(activeQuestions));
                    kState.play.team2Questions = JSON.parse(JSON.stringify(activeQuestions));
                }
                
                // Đảo đáp án nếu cấu hình cho phép
                if (!kState.settings.dontShuffleAnswers) {
                    kState.play.team1Questions.forEach(q => q.options.sort(() => 0.5 - Math.random()));
                    kState.play.team2Questions.forEach(q => q.options.sort(() => 0.5 - Math.random()));
                }

                if (window.keocoInterval) clearInterval(window.keocoInterval);
                window.keocoInterval = setInterval(window.updateKeoCoLogic, 1000);
                
                if (window.keocoKeyListener) document.removeEventListener('keydown', window.keocoKeyListener);
                window.keocoKeyListener = window.handleKeoCoKeyPress;
                document.addEventListener('keydown', window.keocoKeyListener);

                window.initKeoCoKien(); 

                // Tự động kích hoạt toàn màn hình ngay trong khung thao tác click chuột
                if (window.toggleGameFullscreen) {
                    window.toggleGameFullscreen();
                }
            };

            window.stopKeoCoGame = () => { 
                if (window.keocoInterval) clearInterval(window.keocoInterval);
                if (window.keocoKeyListener) document.removeEventListener('keydown', window.keocoKeyListener);
                
                if (document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement) {
                    if (document.exitFullscreen) { document.exitFullscreen().catch(() => {}); }
                    else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
                }
                const elem1 = document.getElementById('game-mount-point');
                if (elem1) elem1.classList.remove('fixed-fullscreen');
                const elem2 = document.getElementById('keoco-game-container');
                if (elem2) elem2.classList.remove('fixed-fullscreen');

                kState.view = 'config'; 
                window.initKeoCoKien(); 
            };

            window.toggleGameFullscreen = function() {
                const elem = document.getElementById('game-mount-point') || document.getElementById('keoco-game-container');
                if (!elem) return;
                const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
                if (!isFS && !elem.classList.contains('fixed-fullscreen')) {
                    elem.classList.add('fixed-fullscreen');
                    if (elem.requestFullscreen) { elem.requestFullscreen().catch(() => {}); }
                    else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
                    else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }
                } else {
                    elem.classList.remove('fixed-fullscreen');
                    const gameElem = document.getElementById('keoco-game-container');
                    if (gameElem) gameElem.classList.remove('fixed-fullscreen');
                    if (document.exitFullscreen) { document.exitFullscreen().catch(() => {}); }
                    else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
                }
            };

            // AI Kéo Co dùng chung API Key đã nhập ở Góc Trò Chơi.
            // Không yêu cầu nhập API lần thứ hai.
            window.openAIGeneratorModal = () => window.openGameAIGeneratorModal('keo-co-kien');
            window.generateAIQuestions = () => window.generateGameAIQuestions('keo-co-kien');

            // Modal Thư viện câu hỏi (Library Modal)
            window.openKeoCoLibraryModal = () => {
                const library = kState.questionLibrary || [];
                const libHtml = library.map((q, idx) => `
                    <div class="p-4 bg-white rounded-2xl border border-slate-200 hover:border-blue-400 transition-all flex items-start gap-3 shadow-sm group">
                        <input type="checkbox" value="${q.id}" class="lib-q-check w-5 h-5 accent-blue-600 cursor-pointer mt-1 rounded">
                        <div class="flex-1 min-w-0 text-left">
                            <div class="font-bold text-slate-800 text-sm mb-2 break-words">${idx + 1}. ${escapeHtmlAttr(q.text)}</div>
                            <div class="flex flex-wrap gap-1.5">
                                ${q.options.map(o => `
                                    <span class="px-2 py-0.5 rounded text-xs font-semibold ${o.isCorrect ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-500 border border-slate-200'}">${escapeHtmlAttr(o.text)}</span>
                                `).join('')}
                            </div>
                        </div>
                        <button onclick="deleteFromLibrary('${q.id}')" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="Xóa khỏi thư viện"><i class="ph-bold ph-trash"></i></button>
                    </div>
                `).join('');

                const modalHtml = `
                    <div class="fixed inset-0 bg-slate-900/70 z-[100] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" id="keoco-library-modal">
                        <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[85vh]">
                            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-6 flex justify-between items-center">
                                <div>
                                    <h3 class="font-black text-xl flex items-center gap-2"><i class="ph-fill ph-books text-2xl"></i> THƯ VIỆN CÂU HỎI (${library.length} câu)</h3>
                                    <p class="text-xs text-blue-100 mt-1">Tích chọn các câu hỏi bạn muốn đưa vào bộ câu hỏi thi đấu</p>
                                </div>
                                <button onclick="closeModal('keoco-library-modal')" class="bg-white/10 p-2 rounded-full hover:bg-white/20 transition-colors"><i class="ph-bold ph-x text-lg"></i></button>
                            </div>

                            <div class="p-4 bg-slate-100 border-b border-slate-200 flex justify-between items-center text-xs font-bold text-slate-600">
                                <div class="flex items-center gap-3 flex-wrap">
                                    <button onclick="toggleSelectAllLibrary(true)" class="text-blue-600 hover:underline"><i class="ph-bold ph-check-square"></i> Chọn tất cả</button>
                                    <button onclick="toggleSelectAllLibrary(false)" class="text-slate-500 hover:underline"><i class="ph-bold ph-square"></i> Bỏ chọn</button>
                                    <button onclick="deleteAllKeoCoLibraryQuestions()" class="text-red-600 hover:underline"><i class="ph-bold ph-trash"></i> Xóa tất cả</button>
                                </div>
                                <button onclick="openAIGeneratorModal()" class="px-3 py-1.5 bg-purple-600 text-white rounded-lg hover:bg-purple-700 flex items-center gap-1"><i class="ph-fill ph-sparkle"></i> Tạo thêm bằng AI</button>
                            </div>

                            <div class="p-6 bg-slate-50 space-y-3 overflow-y-auto custom-scrollbar flex-1">
                                ${library.length > 0 ? libHtml : '<div class="p-12 text-center text-slate-400 font-medium italic">Thư viện trống. Hãy bấm "Tạo bằng AI" hoặc thêm câu hỏi để tạo thư viện!</div>'}
                            </div>

                            <div class="p-4 bg-white border-t border-slate-200 flex justify-between items-center">
                                <button onclick="closeModal('keoco-library-modal')" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs transition-colors">Đóng</button>
                                <button onclick="addSelectedFromLibraryToQuestions()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl text-xs transition-all shadow-md flex items-center gap-2">
                                    <i class="ph-bold ph-plus-circle text-base"></i> ĐƯA CÁC CÂU ĐÃ CHỌN VÀO BỘ CÂU HỎI
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('modal-container').innerHTML = modalHtml;
            };

            window.toggleSelectAllLibrary = (select) => {
                document.querySelectorAll('.lib-q-check').forEach(cb => cb.checked = select);
            };

            window.deleteFromLibrary = (libId) => {
                if (kState.questionLibrary) {
                    kState.questionLibrary = kState.questionLibrary.filter(q => q.id.toString() !== libId.toString());
                    saveData();
                    window.openKeoCoLibraryModal();
                    window.initKeoCoKien();
                    showToast("Đã xóa câu hỏi khỏi thư viện!", "success");
                }
            };

            window.deleteAllKeoCoLibraryQuestions = () => {
                const count = (kState.questionLibrary || []).length;
                if (!count) return showToast("Thư viện đang trống!", "error");
                if (!confirm(`Xóa toàn bộ ${count} câu hỏi trong thư viện? Thao tác này không thể hoàn tác.`)) return;
                kState.questionLibrary = [];
                saveData();
                window.openKeoCoLibraryModal();
                window.initKeoCoKien();
                showToast("Đã xóa tất cả câu hỏi trong thư viện!", "success");
            };

            window.addSelectedFromLibraryToQuestions = () => {
                const selectedCbs = document.querySelectorAll('.lib-q-check:checked');
                if (selectedCbs.length === 0) return showToast("Vui lòng chọn ít nhất 1 câu hỏi từ thư viện!", "error");

                let added = 0;
                selectedCbs.forEach(cb => {
                    const libId = cb.value;
                    const found = (kState.questionLibrary || []).find(q => q.id.toString() === libId.toString());
                    if (found) {
                        kState.questions.push({
                            id: Date.now() + Math.random(),
                            text: found.text,
                            options: JSON.parse(JSON.stringify(found.options))
                        });
                        added++;
                    }
                });

                closeModal('keoco-library-modal');
                saveData();
                window.initKeoCoKien();
                showToast(`Đã thêm ${added} câu hỏi vào Bộ câu hỏi thi đấu!`, "success");
            };

            window.deleteKeoCoQuestion = (qId) => {
                const q = kState.questions.find(x => x.id.toString() === qId.toString());
                if (q) {
                    q.isDeleted = true;
                }
                saveData();
                window.initKeoCoKien();
                showToast("Đã chuyển câu hỏi vào danh sách Đã xóa!", "success");
            };

            window.restoreKeoCoQuestion = (qId) => {
                const q = kState.questions.find(x => x.id.toString() === qId.toString());
                if (q) {
                    q.isDeleted = false;
                }
                saveData();
                window.initKeoCoKien();
                showToast("Đã khôi phục câu hỏi!", "success");
            };

            window.permanentlyDeleteKeoCoQuestion = (qId) => {
                kState.questions = kState.questions.filter(q => q.id.toString() !== qId.toString());
                saveData();
                window.initKeoCoKien();
                showToast("Đã xóa vĩnh viễn câu hỏi!", "success");
            };

            window.deleteAllKeoCoQuestions = () => {
                if (kState.questions.length === 0) return;
                const activeCount = kState.questions.filter(q => !q.isDeleted).length;
                if (activeCount > 0) {
                    if (confirm("Chuyển tất cả câu hỏi hiện tại vào danh sách đã xóa?")) {
                        kState.questions.forEach(q => q.isDeleted = true);
                        saveData();
                        window.initKeoCoKien();
                        showToast("Đã ẩn tất cả câu hỏi vào danh sách đã xóa!", "success");
                    }
                } else {
                    if (confirm("Xóa vĩnh viễn toàn bộ câu hỏi trong danh sách?")) {
                        kState.questions = [];
                        saveData();
                        window.initKeoCoKien();
                        showToast("Đã xóa vĩnh viễn tất cả câu hỏi!", "success");
                    }
                }
            };

            window.openManualEditModal = (qId = null) => {
                let q = { text: '', options: [{ text: '', isCorrect: true }, { text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }] };
                if (qId) {
                    const found = kState.questions.find(x => x.id.toString() === qId.toString());
                    if (found) q = JSON.parse(JSON.stringify(found));
                }

                const modalHtml = `
                    <div class="fixed inset-0 bg-slate-900/70 z-[100] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" id="manual-q-modal">
                        <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-lg overflow-hidden flex flex-col">
                            <div class="bg-slate-800 text-white p-6 flex justify-between items-center">
                                <h3 class="font-black text-xl flex items-center gap-2"><i class="ph-fill ph-pencil-simple"></i> ${qId ? 'SỬA CÂU HỎI' : 'THÊM CÂU HỎI TỰ NHẬP'}</h3>
                                <button onclick="closeModal('manual-q-modal')" class="bg-white/10 p-2 rounded-full hover:bg-white/20 transition-colors"><i class="ph-bold ph-x text-lg"></i></button>
                            </div>
                            <div class="p-6 bg-slate-50 space-y-4 text-left">
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1">Nội dung câu hỏi:</label>
                                    <input type="text" id="mq-text" value="${escapeHtmlAttr(q.text)}" placeholder="Vd: 2 + 2 bằng mấy?" class="w-full px-4 py-2.5 bg-white border border-slate-300 rounded-xl text-sm font-bold outline-none focus:border-slate-800 shadow-sm">
                                </div>
                                
                                <div class="space-y-2">
                                    <label class="block text-xs font-bold text-slate-600 mb-1">Các đáp án (tích chọn đáp án ĐÚNG):</label>
                                    ${q.options.map((opt, idx) => `
                                        <div class="flex items-center gap-2">
                                            <input type="radio" name="mq-correct" value="${idx}" ${opt.isCorrect ? 'checked' : ''} class="w-5 h-5 accent-emerald-600 cursor-pointer">
                                            <input type="text" id="mq-opt-${idx}" value="${escapeHtmlAttr(opt.text)}" placeholder="Đáp án ${idx + 1}" class="flex-1 px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs font-semibold outline-none focus:border-emerald-500">
                                        </div>
                                    `).join('')}
                                </div>

                                <button onclick="saveManualQuestion('${qId || ''}')" class="w-full py-3.5 bg-slate-800 hover:bg-slate-900 text-white font-black rounded-xl shadow-lg transition-all text-sm mt-4">
                                    LƯU CÂU HỎI
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('modal-container').innerHTML = modalHtml;
            };

            window.saveManualQuestion = (qId = '') => {
                const text = document.getElementById('mq-text')?.value.trim();
                if (!text) return showToast("Vui lòng nhập nội dung câu hỏi!", "error");

                const selectedCorrect = document.querySelector('input[name="mq-correct"]:checked')?.value || '0';
                const correctIdx = parseInt(selectedCorrect);

                const options = [0, 1, 2, 3].map(i => ({
                    text: document.getElementById(`mq-opt-${i}`)?.value.trim() || `Đáp án ${i + 1}`,
                    isCorrect: i === correctIdx
                }));

                if (qId) {
                    const idx = kState.questions.findIndex(x => x.id.toString() === qId.toString());
                    if (idx > -1) {
                        kState.questions[idx] = { ...kState.questions[idx], text, options };
                    }
                } else {
                    kState.questions.push({
                        id: Date.now() + Math.random(),
                        text,
                        options

        window.initGameListPlaceholder = function() {
            let player = { w: 80, h: 24, speed: 8, dx: 0 };
            player.x = canvas.width / 2 - player.w / 2;
            player.y = canvas.height - 40;
            let items = [];
            
            // Xóa sự kiện bàn phím cũ nếu load lại
            if(window.catchKeyDown) document.removeEventListener('keydown', window.catchKeyDown);
            if(window.catchKeyUp) document.removeEventListener('keyup', window.catchKeyUp);
            
            window.catchKeyDown = (e) => { if(e.key === 'ArrowLeft') player.dx = -player.speed; else if(e.key === 'ArrowRight') player.dx = player.speed; };
            window.catchKeyUp = (e) => { if(e.key === 'ArrowLeft' || e.key === 'ArrowRight') player.dx = 0; };
            
            document.addEventListener('keydown', window.catchKeyDown);
            document.addEventListener('keyup', window.catchKeyUp);
            
            const leftBtn = document.getElementById('catch-left-btn');
            const rightBtn = document.getElementById('catch-right-btn');
            if (leftBtn && rightBtn) {
                leftBtn.addEventListener('touchstart', (e)=>{e.preventDefault(); player.dx = -player.speed;});
                leftBtn.addEventListener('touchend', (e)=>{e.preventDefault(); player.dx = 0;});
                rightBtn.addEventListener('touchstart', (e)=>{e.preventDefault(); player.dx = player.speed;});
                rightBtn.addEventListener('touchend', (e)=>{e.preventDefault(); player.dx = 0;});
            }
            
            window.startCatchGame = function() {
                score = 0; lives = 3; items = []; isPlaying = true; 
                player.x = canvas.width/2 - player.w/2;
                player.y = canvas.height - 40;
                document.getElementById('catch-score').innerText = score;
                document.getElementById('catch-lives').innerText = lives;
                const btn = document.getElementById('catch-btn');
                btn.innerText = "ĐANG CHƠI"; btn.disabled = true;
                btn.classList.replace('bg-emerald-500', 'bg-slate-600');
                btn.classList.replace('hover:bg-emerald-600', 'hover:bg-slate-600');
                btn.classList.replace('border-emerald-400', 'border-slate-500');
                if(!window.activeGameLoop) update();
            }
            
            const gameOver = () => {
                isPlaying = false;
                if (window.activeGameLoop) cancelAnimationFrame(window.activeGameLoop);
                window.activeGameLoop = null;
                const btn = document.getElementById('catch-btn');
                btn.innerText = "CHƠI LẠI"; btn.disabled = false;
                btn.classList.replace('bg-slate-600', 'bg-emerald-500');
                btn.classList.replace('hover:bg-slate-600', 'hover:bg-emerald-600');
                btn.classList.replace('border-slate-500', 'border-emerald-400');
                
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.fillRect(0,0,canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '900 40px Inter';
                ctx.textAlign = 'center';
                ctx.fillText('HẾT TRÒ CHƠI', canvas.width/2, canvas.height/2 - 20);
                ctx.font = '700 24px Inter';
                ctx.fillStyle = '#facc15';
                ctx.fillText(`Điểm của bạn: ${score}`, canvas.width/2, canvas.height/2 + 25);
            };
            
            const spawnItem = () => {
                if (Math.random() < 0.03 + (score * 0.0005)) { // Spawn rate tăng nhẹ
                    const isBad = Math.random() < 0.25; // Quả mìn đỏ
                    items.push({
                        x: Math.random() * (canvas.width - 30) + 15,
                        y: -20, r: 12,
                        speed: Math.random() * 2 + 3 + (score * 0.05),
                        isBad: isBad
                    });
                }
            };
            
            const drawPlayer = () => {
                ctx.fillStyle = '#3b82f6';
                ctx.beginPath(); ctx.roundRect(player.x, player.y, player.w, player.h, 6); ctx.fill();
                ctx.fillStyle = '#60a5fa';
                ctx.beginPath(); ctx.roundRect(player.x + 4, player.y + 4, player.w - 8, player.h - 12, 4); ctx.fill();
            };
            
            const update = () => {
                if (!isPlaying) return;
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                player.x += player.dx;
                if (player.x < 0) player.x = 0;
                if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;
                
                drawPlayer();
                spawnItem();
                
                for (let i = 0; i < items.length; i++) {
                    let it = items[i]; it.y += it.speed;
                    
                    // Vẽ vật phẩm rơi
                    ctx.beginPath();
                    ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);
                    ctx.fillStyle = it.isBad ? '#ef4444' : '#facc15';
                    ctx.fill();
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
                    
                    // Va chạm với Giỏ
                    if (it.y + it.r >= player.y && it.y - it.r <= player.y + player.h &&
                        it.x + it.r >= player.x && it.x - it.r <= player.x + player.w) {
                        
                        if (it.isBad) { lives--; document.getElementById('catch-lives').innerText = lives; } 
                        else { score += 10; document.getElementById('catch-score').innerText = score; }
                        items.splice(i, 1); i--;
                        
                        if (lives <= 0) { gameOver(); return; }
                        continue;
                    }
                    
                    // Rớt ra khỏi màn hình
                    if (it.y - it.r > canvas.height) {
                        if (!it.isBad) { lives--; document.getElementById('catch-lives').innerText = lives; }
                        items.splice(i, 1); i--;
                        if (lives <= 0) { gameOver(); return; }
                    }
                }
                window.activeGameLoop = requestAnimationFrame(update);
            };
            
            // Vẽ màn hình chờ ban đầu
            ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
            ctx.fillRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = '700 24px Inter';
            ctx.textAlign = 'center';
            ctx.fillText('Nhấn Bắt Đầu ở góc trên bên phải', canvas.width/2, canvas.height/2);
        };

        window.downloadSampleExcel = function() {
            try {
                // Tạo dữ liệu mẫu
                const sampleData = [
                    ["Họ Tên", "Giới tính", "Tổ", "Vai trò", "Mục tiêu", "Năng khiếu"],
                    ["Nguyễn Văn An", "Nam", "Tổ 1", "Lớp trưởng", "Học sinh giỏi", "Toán học"],
                    ["Trần Thị Bình", "Nữ", "Tổ 2", "Lớp phó", "Học sinh xuất sắc", "Văn nghệ"],
                    ["Lê Hoàng Cường", "Nam", "Tổ 3", "Tổ trưởng", "Tiến bộ", "Thể thao"]
                ];
                
                // Khởi tạo Sheet
                const ws = XLSX.utils.aoa_to_sheet(sampleData);
                
                // Định dạng độ rộng cột cho đẹp
                ws['!cols'] = [
                    { wch: 22 }, // Họ Tên
                    { wch: 12 }, // Giới tính
                    { wch: 12 }, // Tổ
                    { wch: 18 }, // Vai trò
                    { wch: 22 }, // Mục tiêu
                    { wch: 18 }  // Năng khiếu
                ];
                
                // Tạo file và Tải về
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Danh_Sach_Mau");
                XLSX.writeFile(wb, "Danh_Sach_Hoc_Sinh_Mau.xlsx");
                
                showToast("Đã tải xuống File Excel mẫu thành công!", "success");
            } catch (err) {
                console.error(err);
                showToast("Lỗi khi tạo file Excel mẫu!", "error");
            }
        };

        // --- Helper functions for the new Points Form ---
        window.updatePointsForm = function(key, value) {
            state.pointsForm[key] = value;
            
            // If changing action type, reset quick selection related fields
            if (key === 'actionType') {
                state.pointsForm.pointsVal = 0;
                state.pointsForm.reason = '';
                state.pointsForm.selectedCriteria = [];
            }
            renderLayout();
        };

        window.toggleQuickCriterion = function(reason, points, category) {
            if (!state.pointsForm.selectedCriteria) state.pointsForm.selectedCriteria = [];
            const index = state.pointsForm.selectedCriteria.findIndex(item => item.reason === reason);
            
            if (index > -1) {
                // Đã chọn trước đó -> Bỏ chọn
                state.pointsForm.selectedCriteria.splice(index, 1);
            } else {
                // Chưa chọn -> Thêm vào danh sách chọn
                state.pointsForm.selectedCriteria.push({ reason, points, category });
            }

            // Tính toán tổng số điểm và ghép nối các lý do
            if (state.pointsForm.selectedCriteria.length > 0) {
                state.pointsForm.pointsVal = state.pointsForm.selectedCriteria.reduce((sum, item) => sum + item.points, 0);
                state.pointsForm.reason = state.pointsForm.selectedCriteria.map(item => item.reason).join(', ');
                const lastItem = state.pointsForm.selectedCriteria[state.pointsForm.selectedCriteria.length - 1];
                if (lastItem && lastItem.category) {
                    state.pointsForm.category = lastItem.category;
                }
            } else {
                state.pointsForm.pointsVal = 0;
                state.pointsForm.reason = '';
            }
            
            renderLayout();
        };
        window.applyQuickCriterion = window.toggleQuickCriterion;

        window.resetPointsForm = function() {
            state.pointsForm = {
                actionType: 'add', targetType: 'student', selectedTargetId: '', pointsVal: 0, category: 'Học tập', reason: '', note: '', selectedCriteria: []
            };
            renderLayout();
        };

        window.executePointsSubmission = function() {
            const pf = state.pointsForm;
            const pointsToApply = pf.actionType === 'add' ? parseInt(pf.pointsVal) : -parseInt(pf.pointsVal);
            
            if (isNaN(pointsToApply) || pointsToApply === 0) return showToast("Số điểm không hợp lệ!", "error");
            if (!pf.reason.trim()) return showToast("Vui lòng chọn hoặc nhập lý do!", "error");

            let targetStudents = [];
            let successMsg = "";

            if (pf.targetType === 'student') {
                const s = state.students.find(x => x.id.toString() === pf.selectedTargetId.toString());
                if (!s) return showToast("Vui lòng chọn học sinh!", "error");
                targetStudents.push(s);
                successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho ${s.name}`;
            } 
            else if (pf.targetType === 'group') {
                targetStudents = state.students.filter(x => x.group === pf.selectedTargetId);
                if (targetStudents.length === 0) return showToast(`Nhóm ${pf.selectedTargetId} chưa có học sinh!`, "error");
                successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho Tổ ${pf.selectedTargetId}`;
            } 
            else if (pf.targetType === 'class') {
                targetStudents = [...state.students];
                if (targetStudents.length === 0) return showToast("Lớp chưa có học sinh!", "error");
                successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho Toàn Lớp`;
            }

            // Apply points and log history
            const historyEntry = {
                id: Date.now(),
                date: new Date().toISOString(),
                points: pointsToApply,
                reason: pf.reason.trim() + (pf.note ? ` (${pf.note.trim()})` : '') + ` [${pf.category}]`
            };

            targetStudents.forEach(s => {
                s.points = Math.max(0, (s.points || 0) + pointsToApply);
                s.stars = Math.max(0, (s.stars || 0) + pointsToApply);
                if (!s.history) s.history = [];
                s.history.push({...historyEntry, id: Date.now() + Math.random()});
            });

            saveData();
            
            // Reset form
            state.pointsForm.pointsVal = 0;
            state.pointsForm.reason = '';
            state.pointsForm.note = '';
            state.pointsForm.selectedCriteria = [];
            
            renderLayout();
            showToast(successMsg, pointsToApply > 0 ? "success" : "error");
            if (pointsToApply > 0) triggerConfetti();
        };

        // Select student for points via other views
        function selectStudentForPoints(id) { 
            state.selectedStudentForPoints = id; 
            state.pointsForm.targetType = 'student';
            state.pointsForm.selectedTargetId = id.toString();
            renderLayout(); 
        }

        function awardPoints(points, reason) {

        function saveNewCriterion() {
            const val = state.pointsForm.pointsVal;
            const reason = state.pointsForm.reason.trim();
            const category = state.pointsForm.category;
            
            if (isNaN(val) || val <= 0) return showToast("Vui lòng nhập số điểm > 0 để lưu mẫu!", "error");
            if (!reason) return showToast("Vui lòng nhập lý do tiêu chí!", "error");
            
            if (state.pointsForm.actionType === 'add') {
                state.criteria.positive.push({ points: val, reason: reason, category: category });
            } else {
                state.criteria.negative.push({ points: val, reason: reason, category: category });
            }
            saveData(); renderLayout(); showToast("Đã lưu tiêu chí mới thành công!");
        }

            if (confirm("Xóa tiêu chí này khỏi danh sách?")) { state.criteria[type].splice(index, 1); saveData(); renderLayout(); showToast("Đã xóa"); }

        const DUCK_RACE_COLORS = ['#facc15','#fb7185','#22d3ee','#a78bfa','#fb923c','#34d399','#60a5fa','#f472b6','#2dd4bf','#fde047','#93c5fd','#bef264'];
        const DUCK_RACE_ACCESSORIES = ['👑','🎩','🧢','🎉','🤓','😎','🎀','🎅','🌼','⭐','❤️',''];
        let duckRaceLastRanking = [];
        let duckRaceSoundEnabled = true;

        function duckHash(value) {
            const s = String(value ?? 'duck');
            let h = 2166136261;
            for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
            return Math.abs(h >>> 0);
        }

        function makeDuckRaceSvg(color, accessory = '') {
            return `
                <div class="duck-racer-inner">
                    ${accessory ? `<div class="duck-accessory">${accessory}</div>` : ''}
                    <svg viewBox="0 0 92 62" width="74" height="50" aria-hidden="true">
                        <ellipse cx="44" cy="43" rx="29" ry="16" fill="${color}"/>
                        <ellipse cx="42" cy="43" rx="15" ry="8" fill="rgba(255,255,255,.20)" transform="rotate(-12 42 43)"/>
                        <circle cx="65" cy="25" r="14" fill="${color}"/>
                        <path d="M76 27 L91 31 L76 35 Z" fill="#fb923c"/>
                        <circle cx="69" cy="21" r="4.3" fill="#fff"/>
                        <circle cx="70" cy="21" r="2.1" fill="#0f172a"/>
                        <path d="M19 42 C10 37,7 31,10 26 C17 31,23 33,29 33" fill="${color}"/>
                        <path d="M16 47 C11 49,8 51,4 55" stroke="#fb923c" stroke-width="3.2" stroke-linecap="round"/>
                        <path d="M24 51 C20 54,17 56,14 59" stroke="#fb923c" stroke-width="3.2" stroke-linecap="round"/>
                    </svg>
                </div>`;
        }

        function getDuckInitialLayout(student, index, total) {
            const seed = duckHash(`${student.id || student.code || student.name}-${index}`);
            // Tất cả vịt cùng đứng trên một vạch xuất phát. Chỉ dàn đều theo chiều dọc.
            const safeTotal = Math.max(1, total);
            const topMin = 7;
            const topMax = 88;
            const top = safeTotal === 1
                ? 47
                : topMin + (index * (topMax - topMin) / (safeTotal - 1));
            const left = 8.5; // trùng với vạch XUẤT PHÁT
            return { top: Math.max(topMin, Math.min(topMax, top)), left, seed };
        }

        function renderDuckRaceView(headerHtml) {
            const students = Array.isArray(state.students) ? state.students : [];
            const densityClass = students.length > 26 ? 'duck-dense' : (students.length > 18 ? 'duck-mid' : '');
            const racers = students.map((s, i) => {
                const pos = getDuckInitialLayout(s, i, students.length);
                const color = DUCK_RACE_COLORS[pos.seed % DUCK_RACE_COLORS.length];
                const accessory = DUCK_RACE_ACCESSORIES[(pos.seed >> 3) % DUCK_RACE_ACCESSORIES.length];
                return `
                    <div id="duck-racer-${i}" class="duck-racer" data-duck-index="${i}" data-student-id="${mfgEsc(s.id)}"
                         style="left:${pos.left}%; top:${pos.top}%;">
                        ${makeDuckRaceSvg(color, accessory)}
                        <div class="duck-racer-label" title="${mfgEsc(s.name)}">${mfgEsc(s.name)}</div>
                    </div>`;
            }).join('');

            return `
                <div class="max-w-[1600px] mx-auto animate-fade-in pt-2 pb-6 min-h-full">
                    <div id="duck-race-shell" class="duck-race-shell">
                        <canvas id="confetti-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-[90]"></canvas>
                        <div class="duck-water ${densityClass}" id="duck-race-water">
                            <div class="duck-bank top"></div>
                            <div class="duck-bank bottom"></div>
                            <div class="duck-start-line" id="duck-start-line"></div>

        window.startDuckRace = function() {
            if (isDuckRacing) return;
            const students = Array.isArray(state.students) ? [...state.students] : [];
            if (!students.length) return showToast('Chưa có học sinh để đua!', 'error');
            const water = document.getElementById('duck-race-water');
            if (!water) return;

            isDuckRacing = true;
            duckRaceLastRanking = [];
            if (duckRaceAnimationRef) cancelAnimationFrame(duckRaceAnimationRef);
            const btn = document.getElementById('duck-race-start-btn');
            if (btn) { btn.disabled = true; btn.innerHTML = '<div class="text-2xl animate-bounce">🦆</div><div class="text-[10px] mt-1">Đang đua</div>'; }
            const result = document.getElementById('duck-race-result');
            if (result) result.innerHTML = '<span class="animate-pulse">🏁 Xuất phát! Các chú vịt đang tăng tốc...</span>';
            const panel = document.getElementById('duck-ranking-panel');
            if (panel) panel.classList.add('hidden');

            const winnerIndex = Math.floor(Math.random() * students.length);
            const finishLine = document.getElementById('duck-finish-line');
            const finishX = finishLine ? finishLine.offsetLeft : water.clientWidth * .90;

            duckRaceData = students.map((s, i) => {
                const el = document.getElementById(`duck-racer-${i}`);
                if (el) {
                    el.classList.add('racing');
                    el.style.transition = 'none';
                    el.style.transform = 'translate3d(0,0,0)';
                }
                const startX = el ? el.offsetLeft : water.clientWidth * .08;
                const startY = el ? el.offsetTop : 40;
                const seed = duckHash(`${s.id || s.name}-race-${Date.now()}-${i}`);
                const finalRatio = i === winnerIndex ? 1.045 : (0.74 + ((seed % 220) / 1000)); // 0.74 -> 0.959, không vượt vạch đích
                return {
                    student: s,
                    startX, startY,
                    travel: Math.max(70, finishX - startX - 18),
                    finalRatio,
                    phase: (seed % 628) / 100,
                    burst1: .68 + ((seed >> 4) % 24) / 100,
                    burst2: .84 + ((seed >> 8) % 14) / 100,
                    laneWave: 2 + ((seed >> 12) % 7),
                    liveProgress: 0
                };
            });

            // Cho trình duyệt vẽ lại vị trí xuất phát trước khi bắt đầu.
            void water.offsetWidth;
            const duration = 6200 + Math.random() * 900;
            const start = performance.now();

            try { if (duckRaceSoundEnabled && Tone.context.state !== 'running') Tone.start(); } catch(e) {}
            let quack = null;
            try {
                if (duckRaceSoundEnabled) {
                    quack = new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:.004,decay:.055,sustain:0,release:.045}}).toDestination();
                    quack.volume.value=-18;
                }
            } catch(e) {}
            let lastQuackAt = 0;

            const animate = (now) => {
                if (!isDuckRacing) return;
                const t = Math.min(1, (now - start) / duration);
                // Tiến trình nền: chậm đầu, tăng tốc giữa, bứt tốc cuối.
                const base = t < .18 ? (t/.18)*.10 : .10 + (1 - Math.pow(1 - (t-.18)/.82, 2.35))*.90;

                duckRaceData.forEach((d, i) => {
                    const duck = document.getElementById(`duck-racer-${i}`);
                    if (!duck) return;
                    const boost = Math.sin(t * 12 + d.phase) * .025 + Math.sin(t * 31 + d.phase*1.7) * .009;
                    let p = Math.max(0, base * d.finalRatio + boost * (1-t));
                    // Winner có pha bứt tốc rõ ràng ở 20% cuối để cán đích đầu tiên.
                    if (i === winnerIndex && t > .78) {
                        const kick = (t - .78) / .22;
                        p = Math.max(p, (.78 + kick * .265));
                    }
                    if (t >= 1) p = d.finalRatio;
                    d.liveProgress = p;
                    const x = d.travel * p;
                    const y = Math.sin(t * 24 + d.phase) * d.laneWave + Math.sin(t*9 + d.phase) * 2;
                    duck.style.transform = `translate3d(${Math.round(x)}px,${y.toFixed(1)}px,0)`;
                });

                if (quack && now - lastQuackAt > 390 && Math.random() > .55) {
                    lastQuackAt = now;
                    try { quack.triggerAttackRelease(Math.random()>.5?'C5':'E5','32n'); } catch(e){}
                }

                if (t < 1) duckRaceAnimationRef = requestAnimationFrame(animate);
                else {
                    const ranking = [...duckRaceData].sort((a,b) => b.finalRatio - a.finalRatio).map((d, idx) => ({student:d.student, rank:idx+1, progress:d.finalRatio}));
                    duckRaceLastRanking = ranking;
                    finishDuckRace(duckRaceData[winnerIndex].student);
                }
            };
            duckRaceAnimationRef = requestAnimationFrame(animate);
        };

        function finishDuckRace(winner) {

        window.startStageRaffle = function() {
            if(isStagePlaying) return;
            let items = stageSettings.target === 'student' ? state.students : state.groups;
            if(items.length === 0) return showToast('Chưa có dữ liệu để gọi tên!', 'error');

            isStagePlaying = true;
            const btn = document.getElementById('stage-start-btn');
            if(btn) {
                btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin text-xl"></i> ĐANG GỌI...`;
                btn.classList.add('opacity-70', 'cursor-not-allowed');
            }

            if (Tone.context.state !== 'running') Tone.start();
            let flySynth = null;
            try { flySynth = new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.1, decay: 0.1, sustain: 0.1, release: 0.5 } }).toDestination(); flySynth.volume.value = -15; } catch(e) {}

            const container = document.getElementById('stage-container');
            if(!container) return;

            // Lấy kích thước chuẩn (có dự phòng để không bị chia 0)
            const w = Math.max(container.offsetWidth, 300);
            const h = Math.max(container.offsetHeight, 300);

            // Khởi tạo thông số cho các thẻ bay
            stageCardsData = items.map((item, i) => {
                return {
                    id: item.id,
                    name: item.name,
                    avatarUrl: item.avatarUrl,
                    x: Math.random() * (w - 120),
                    y: Math.random() * (h - 120),
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    baseX: Math.random() * w,
                    baseY: Math.random() * h,
                    angleOffset: Math.random() * Math.PI * 2,
                    radiusX: 50 + Math.random() * Math.max(20, w/2 - 120),
                    radiusY: 50 + Math.random() * Math.max(20, h/2 - 120),
                    speed: (Math.random() * 1.5 + 0.5) * (Math.random() > 0.5 ? 1 : -1)
                };
            });

            // Render thẻ bài vào sân khấu (Đã thêm top-0 left-0, bỏ transition-transform để bay mượt 60fps)
            container.innerHTML = stageCardsData.map(c => `
                <div id="scard-${c.id}" class="absolute top-0 left-0 w-28 p-3 bg-white/95 backdrop-blur-sm rounded-2xl shadow-xl flex flex-col items-center gap-2 border border-slate-100 font-display z-10 will-change-transform" style="transform: translate(${c.x}px, ${c.y}px)">
                    ${getAvatarImg(c.avatarUrl, c.name, "w-14 h-14 ring-2 ring-slate-100 shadow-sm rounded-full")}
                    <div class="text-xs font-black text-slate-800 text-center w-full truncate">${c.name}</div>
                </div>
            `).join('');

            // Chữ thời gian đếm ngược lớn ở giữa
            const timerEl = document.createElement('div');
            timerEl.className = "absolute inset-0 flex items-center justify-center text-[150px] font-black text-white/30 drop-shadow-md z-0 pointer-events-none font-display";
            container.appendChild(timerEl);

            let startTime = Date.now();
            const durationMs = stageSettings.duration * 1000;

            function animate() {
                let elapsed = Date.now() - startTime;
                if(!document.getElementById('stage-container')) {
                    isStagePlaying = false; 
                    return;
                }

                if(elapsed > durationMs) {
                    stopStageRaffle(items);
                    return;
                }

                const tSec = elapsed / 1000;
                timerEl.innerText = Math.ceil((durationMs - elapsed) / 1000);

                if (Math.floor(elapsed / 100) % 2 === 0 && flySynth && Math.random() > 0.8) {
                    try { flySynth.triggerAttackRelease("C5", "32n", Tone.now()); } catch (err) {}
                }

                stageCardsData.forEach((c) => {
                    if(stageSettings.effect === 'chaos') {
                        c.x += c.vx; c.y += c.vy;
                        if(c.x < 0) { c.x = 0; c.vx *= -1; }
                        if(c.x > w - 112) { c.x = w - 112; c.vx *= -1; }
                        if(c.y < 0) { c.y = 0; c.vy *= -1; }
                        if(c.y > h - 120) { c.y = h - 120; c.vy *= -1; }
                    } else if(stageSettings.effect === 'wave') {
                        c.x = (c.baseX + tSec * c.speed * 150) % w;
                        if(c.x < 0) c.x += w;
                        c.y = Math.max(0, Math.min(c.baseY + Math.sin(c.x / 50 + tSec * 2) * 80, h - 120));
                    } else if(stageSettings.effect === 'bubble') {
                        c.y = c.baseY - (tSec * Math.abs(c.speed) * 150) % (h + 200);
                        if(c.y < -100) c.y += h + 200;
                        c.x = Math.max(0, Math.min(c.baseX + Math.sin(c.y / 40 + tSec * 3) * 50, w - 112));
                    } else if(stageSettings.effect === 'spiral') {
                        const r = c.radiusX * (0.1 + Math.min(elapsed/durationMs, 1));
                        const a = c.angleOffset + tSec * c.speed * 3;
                        c.x = w/2 - 56 + Math.cos(a) * r;
                        c.y = h/2 - 60 + Math.sin(a) * r;
                    } else if(stageSettings.effect === 'planet') {
                        const a = c.angleOffset + tSec * c.speed * 2;
                        c.x = w/2 - 56 + Math.cos(a) * c.radiusX;
                        c.y = h/2 - 60 + Math.sin(a) * c.radiusY;
                    } else if(stageSettings.effect === 'figure8') {
                        const a = c.angleOffset + tSec * Math.abs(c.speed) * 2.5;
                        c.x = w/2 - 56 + Math.sin(a) * c.radiusX;
                        c.y = h/2 - 60 + Math.sin(a * 2) * c.radiusY;
                    }
                    
                    // Nảy an toàn không lọt mép màn hình
                    if (['planet', 'spiral', 'figure8'].includes(stageSettings.effect)) {
                        c.x = Math.max(-56, Math.min(c.x, w));
                        c.y = Math.max(-60, Math.min(c.y, h));
                    }

                    const el = document.getElementById(`scard-${c.id}`);
                    if(el) el.style.transform = `translate(${c.x}px, ${c.y}px)`;
                });

                stageAnimationRef = requestAnimationFrame(animate);
            }

            stageAnimationRef = requestAnimationFrame(animate);
        }

        function setupWheel() {
            const canvas = document.getElementById('wheelCanvas'); if (!canvas) return; const ctx = canvas.getContext('2d');
            wheelItems = wheelMode === 'student' ? [...state.students] : [...state.groups]; 
            if (wheelItems.length === 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f8fafc'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#94a3b8'; ctx.font = "600 20px 'Inter', sans-serif"; ctx.textAlign = "center";
                ctx.fillText("Chưa có dữ liệu", canvas.width/2, canvas.height/2);
                return;
            }
            
            const r = canvas.width / 2; const arc = Math.PI * 2 / wheelItems.length;
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            ctx.save(); ctx.translate(r, r); ctx.rotate(wheelRotation * Math.PI / 180);
            
            wheelItems.forEach((item, i) => {
                // Draw slice
                ctx.beginPath(); 
                ctx.fillStyle = wheelColors[i % wheelColors.length];
                ctx.moveTo(0, 0); ctx.arc(0, 0, r, i*arc, (i+1)*arc); ctx.fill(); 
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
                
                // Draw Text
                ctx.save(); 
                // Rotate to the center of the slice
                ctx.rotate(i*arc + arc/2); 
                ctx.textAlign = "right"; ctx.textBaseline = "middle";
                ctx.fillStyle = "#ffffff"; 
                // Use a bold, highly legible font
                ctx.font = "900 16px 'Inter', sans-serif"; 
                
                // Ensure text does not overlap with the center dot
                const text = item.name.length > 20 ? item.name.substring(0,18)+'...' : item.name;
                // Add slight shadow for better contrast
                ctx.shadowColor = "rgba(0,0,0,0.15)"; ctx.shadowBlur = 4; ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 1;
                ctx.fillText(text, r - 25, 0); 
                ctx.restore();
            }); 
            ctx.restore();
        }

        function spinWheel() {
            if (isSpinning || wheelItems.length === 0) return; isSpinning = true;
            document.getElementById('wheel-result-content').innerHTML = `<i class="ph-bold ph-arrows-clockwise text-6xl text-primary mb-6 animate-spin"></i><div class="text-xl font-bold text-primary">Đang quay...</div>`;
            if (Tone.context.state !== 'running') Tone.start();
            let clickSynth = null;
            try { clickSynth = new Tone.Synth({ oscillator: { type: 'square' }, envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.05 } }).toDestination(); clickSynth.volume.value = -10; } catch(e) {}

            const duration = 4500, extraRots = 360 * (6 + Math.random() * 4), targetRot = wheelRotation + extraRots, start = performance.now();
            function animate(time) {
                let t = (time - start) / duration; if (t > 1) t = 1;
                const easeT = 1 - (--t)*t*t*t; const currentRot = wheelRotation + (targetRot - wheelRotation) * easeT;
                const arcDeg = 360 / wheelItems.length;
                if (Math.floor(currentRot / arcDeg) > Math.floor(wheelRotation / arcDeg) && clickSynth) {
                    try { clickSynth.triggerAttackRelease("G5", "32n", Tone.now()); } catch (err) {}
                }
                wheelRotation = currentRot; setupWheel();
                if (t < 0) requestAnimationFrame(animate); else { isSpinning = false; determineWinner(); }
            } requestAnimationFrame(animate);
        }
        function determineWinner() {
            const arcDeg = 360 / wheelItems.length; 
            // The pointer is at top (270 degrees in canvas coords, but we rotated the context).
            // Adjust calculation based on standard top pointer.
            const point = (270 - (wheelRotation%360) + 360) % 360;
            const w = wheelItems[Math.floor(point / arcDeg)];
            
            let actionBtnHtml = '';
            if (wheelMode === 'student') {
                actionBtnHtml = `<button onclick="state.selectedStudentForPoints=${w.id}; switchTab('tich-diem');" class="mt-8 px-10 py-4 bg-gradient-to-r from-emerald-400 to-emerald-600 text-white font-black rounded-2xl shadow-xl hover:shadow-emerald-500/30 hover:-translate-y-1 transition-all w-max mx-auto text-base uppercase tracking-wider flex items-center justify-center gap-2"><i class="ph-fill ph-star text-xl"></i> Khen thưởng ngay</button>`;

            state.students.forEach(s => {

        window.exportData = function() {
            const dataStr = JSON.stringify(state, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = `GIAO VIEN CHU NHIEM_Backup_${getTodayString()}.json`;

            let linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
            showToast("Đã tải xuống bản sao lưu!", "success");
        };

        window.importData = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if (confirm("Cảnh báo: Dữ liệu hiện tại sẽ bị ghi đè hoàn toàn bởi dữ liệu từ file phục hồi. Bạn có chắc chắn muốn tiếp tục?")) {
                        state = { ...state, ...importedState };
                        applyStateDefaults();
                        saveData();
                        renderLayout();
                        showToast("Đã phục hồi dữ liệu thành công!", "success");
                    }
                } catch (error) {
                    showToast("File không hợp lệ hoặc bị lỗi!", "error");
                }
            };
            reader.readAsText(file);
            // Reset input so the same file can be selected again if needed
            event.target.value = '';
        };

        function saveRewardEdit(id) {
            const name = document.getElementById('edit-reward-name').value.trim(), desc = document.getElementById('edit-reward-desc').value.trim();
            const cost = parseInt(document.getElementById('edit-reward-cost').value), icon = document.getElementById('edit-reward-icon').value;
            const colorBase = document.getElementById('edit-reward-color').value;
            if (!name || isNaN(cost)) return showToast("Vui lòng nhập tên và giá sao hợp lệ!", "error");
            let color = `text-${colorBase}-600`, bg = `bg-${colorBase}-100`; if (colorBase === 'blue') color = 'text-blueAccent';
            if (id) {
                const idx = state.rewards.findIndex(r => r.id === id);
                if (idx > -1) state.rewards[idx] = { ...state.rewards[idx], name, desc, cost, icon, color, bg };
            } else state.rewards.push({ id: 'r' + Date.now(), name, desc, cost, icon, color, bg });
            saveData(); renderLayout(); closeModal('edit-reward-modal'); showToast("Đã lưu danh mục quà tặng!");
        }

        function saveStudentEdit() {
            const name = document.getElementById('edit-s-name').value.trim();

            const sData = {
                name: name, gender: document.getElementById('edit-s-gender').value, group: document.getElementById('edit-s-group').value,
                role: document.getElementById('edit-s-role').value.trim(), goal: document.getElementById('edit-s-goal').value.trim(),
                talent: document.getElementById('edit-s-talent').value.trim(),
                avatarUrl: document.getElementById('edit-s-avatar').value.trim()
            };

            if (state.editingStudentId) {
                const index = state.students.findIndex(s => s.id === state.editingStudentId);
                if (index > -1) state.students[index] = { ...state.students[index], ...sData };
            } else {
                const newId = state.students.length > 0 ? Math.max(...state.students.map(s => s.id)) + 1 : 1;
                state.students.push({ id: newId, points: 0, stars: 0, code: generateUniqueCode(), history: [], ...sData });
            }
            saveData(); closeModal('edit-student-modal'); renderLayout(); showToast("Đã lưu thông tin học sinh!");
        }

        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas'); if (!canvas) return; const container = document.getElementById('main-container');
            canvas.width = container.offsetWidth; canvas.height = container.offsetHeight; const ctx = canvas.getContext('2d');
            const particles = [], colors = ['#3b82f6', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6'];
            for (let i = 0; i < 150; i++) particles.push({ x: canvas.width/2, y: canvas.height/2+50, r: Math.random()*6+2, dx: Math.random()*16-8, dy: Math.random()*-15-5, color: colors[Math.floor(Math.random()*colors.length)], tilt: Math.floor(Math.random()*10)-10, tiltAngleInc: (Math.random()*0.07)+0.05, tiltAngle: 0 });
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height); let active = 0;
                particles.forEach(p => { if (p.y < canvas.height) active++; p.tiltAngle += p.tiltAngleInc; p.y += (Math.cos(p.tiltAngle) + p.dy + p.r/2)/2; p.x += Math.sin(p.tiltAngle)*2 + p.dx; p.dy += 0.2; ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color; ctx.moveTo(p.x+p.tilt+p.r, p.y); ctx.lineTo(p.x+p.tilt, p.y+p.tilt+p.r); ctx.stroke(); });
                if (active > 0) requestAnimationFrame(render); else ctx.clearRect(0, 0, canvas.width, canvas.height);
            } render();
        }

        /* Retain rest of logical helpers unmodified to ensure functionality */
        function renderDrawerTimerText() {
            const display = document.getElementById('drawer-timer-display');
            if (display) {
                const span = display.querySelector('span');
                const m = Math.floor(timerSeconds / 60), s = timerSeconds % 60; span.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                if (timerSeconds <= 10 && timerSeconds > 0) span.classList.add('text-red-400', 'animate-pulse'); else span.classList.remove('text-red-400', 'animate-pulse');
            }
        }
        function updateTimerFromInputs() {
            if (isTimerRunning) return; 
            let m = parseInt(document.getElementById('drawer-min-input').value)||0, s = parseInt(document.getElementById('drawer-sec-input').value)||0;
            if (s > 59) { m += Math.floor(s / 60); s = s % 60; } if (m > 99) m = 99;
            document.getElementById('drawer-min-input').value = m; document.getElementById('drawer-sec-input').value = s;
            timerSeconds = m * 60 + s; renderDrawerTimerText();
        }
        function toggleDrawerTimer() {
            const startBtn = document.getElementById('drawer-start-btn');
            if (isTimerRunning) {
                clearInterval(timerInterval); isTimerRunning = false; startBtn.innerText = "Tiếp Tục";
            } else {
                if (timerSeconds <= 0) updateTimerFromInputs(); if (timerSeconds <= 0) return;
                isTimerRunning = true; startBtn.innerText = "Tạm Dừng";
                if (Tone.context.state !== 'running') Tone.start();
                let tickSynth = null;
                try { tickSynth = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination(); tickSynth.volume.value = -15; } catch(e) {}
                timerInterval = setInterval(() => {
                    timerSeconds--; renderDrawerTimerText();
                    if (tickSynth && Tone.context.state === 'running') {
                        if (timerSeconds <= 10 && timerSeconds > 0) tickSynth.triggerAttackRelease("E5", "8n");
                        else if (timerSeconds > 10) tickSynth.triggerAttackRelease("C5", "16n");
                    }
                    if (timerSeconds <= 0) {
                        clearInterval(timerInterval); isTimerRunning = false; startBtn.innerText = "Bắt Đầu"; showToast("Hết giờ!", "success");
                        try{ const s = new Tone.PolySynth().toDestination(); s.triggerAttackRelease(['C4','E4','G4'], "1n"); }catch(e){}
                    }
                }, 1000);
            }
        }
