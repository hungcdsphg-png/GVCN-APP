        function magicFingerSound(type) {
            const g = ensureMagicFingerState();
            if (!g.settings.soundEnabled || typeof Tone === 'undefined') return;
            try {
                if (Tone.context.state !== 'running') Tone.start();
                const synth = new Tone.Synth().toDestination();
                if (type === 'correct') synth.triggerAttackRelease('G5', '16n');
                else if (type === 'wrong') synth.triggerAttackRelease('C3', '16n');
                else synth.triggerAttackRelease('C6', '8n');
                setTimeout(() => { try { synth.dispose(); } catch(e) {} }, 800);
            } catch (e) {}
        }

        window.startMagicFingerGame = function() {
            const g = ensureMagicFingerState();
            const validQuestions = g.questions.filter(q => q.text?.trim() && q.options?.length === 4 && q.options.some(o => o.isCorrect));
            if (!validQuestions.length) return showToast('Hãy tạo ít nhất 1 câu hỏi hợp lệ!', 'error');

            const timeLimit = Math.max(10, Number(g.settings.timeLimit) || 90);
            const starsToWin = Math.max(1, Number(g.settings.starsToWin) || 6);
            g.settings.timeLimit = timeLimit;
            g.settings.starsToWin = starsToWin;
            g.view = 'play';
            g.play = {
                status: 'playing',
                timer: timeLimit,
                leftScore: 0,
                rightScore: 0,
                questionIndex: 0,
                questions: g.settings.questionOrder === 'random'
                    ? magicFingerShuffle(JSON.parse(JSON.stringify(validQuestions)))
                    : JSON.parse(JSON.stringify(validQuestions)),
                leftOptions: [], rightOptions: [],
                leftFreezeUntil: 0, rightFreezeUntil: 0,
                roundLocked: false,
                roundMessage: ''
            };
            prepareMagicFingerRound();
            saveData();
            window.initMagicFingerGame();
            window.enterInteractiveGameFullscreen();

            const rt = window.magicFingerRuntime;
            if (rt.timerInterval) clearInterval(rt.timerInterval);
            rt.timerInterval = setInterval(window.updateMagicFingerTimer, 1000);

            if (g.settings.cameraEnabled) setTimeout(() => window.startMagicFingerCamera(), 150);
        };

        window.updateMagicFingerTimer = function() {
            const g = ensureMagicFingerState();
            const p = g.play;
            if (!p || p.status !== 'playing') return;
            p.timer = Math.max(0, p.timer - 1);
            const timer = document.getElementById('mfg-timer');
            if (timer) {
                const m = Math.floor(p.timer / 60);
                const s = p.timer % 60;
                timer.textContent = `${m}:${String(s).padStart(2, '0')}`;
            }
            window.updateMagicFingerFreezeLabels();
            if (p.timer <= 0) window.finishMagicFingerGame('time');
        };

        window.finishMagicFingerGame = function(reason = 'score') {
            const g = ensureMagicFingerState();
            const p = g.play;
            if (!p || p.status === 'finished') return;
            p.status = 'finished';
            if (window.magicFingerRuntime.timerInterval) {
                clearInterval(window.magicFingerRuntime.timerInterval);
                window.magicFingerRuntime.timerInterval = null;
            }
            window.stopMagicFingerCamera(true);
            magicFingerSound('win');
            window.initMagicFingerGame();
        };

        window.submitMagicFingerAnswer = function(side, optionIndex, source = 'click') {
            const g = ensureMagicFingerState();
            const p = g.play;
            if (!p || p.status !== 'playing' || p.roundLocked) return;
            const now = Date.now();
            const freezeKey = side === 'left' ? 'leftFreezeUntil' : 'rightFreezeUntil';
            if ((p[freezeKey] || 0) > now) return;

            const opts = side === 'left' ? p.leftOptions : p.rightOptions;
            const option = opts?.[optionIndex];
            if (!option) return;

            if (option.isCorrect) {
                p.roundLocked = true;
                if (side === 'left') p.leftScore += 1; else p.rightScore += 1;
                p.roundMessage = `${side === 'left' ? g.settings.team1Name : g.settings.team2Name} trả lời đúng!`;
                magicFingerSound('correct');
                window.flashMagicFingerSide(side, true);

                if (p.leftScore >= g.settings.starsToWin || p.rightScore >= g.settings.starsToWin) {
                    setTimeout(() => window.finishMagicFingerGame('score'), 450);
                    return;
                }

                setTimeout(() => {
                    if (!g.play || g.play.status !== 'playing') return;
                    g.play.questionIndex += 1;
                    prepareMagicFingerRound();
                    window.initMagicFingerGame();
                    window.attachMagicFingerRuntimeToDOM();
                }, 600);
            } else {
                p[freezeKey] = now + Math.max(0, Number(g.settings.wrongFreeze) || 2) * 1000;
                p.roundMessage = 'Chưa đúng, thử lại nhé!';
                magicFingerSound('wrong');
                window.flashMagicFingerSide(side, false);
                window.updateMagicFingerFreezeLabels();
                const rtSide = window.magicFingerRuntime.detected[side];
                if (rtSide) rtSide.armed = false;
            }
        };

        window.flashMagicFingerSide = function(side, correct) {
            const el = document.getElementById(`mfg-side-${side}`);
            if (!el) return;
            el.classList.add(correct ? 'ring-8' : 'animate-pulse');
            el.style.filter = correct ? 'brightness(1.13)' : 'brightness(0.88)';
            setTimeout(() => {
                el.classList.remove('ring-8', 'animate-pulse');
                el.style.filter = '';
            }, 450);
        };

        window.updateMagicFingerFreezeLabels = function() {
            const g = ensureMagicFingerState();
            const p = g.play;
            if (!p) return;
            const now = Date.now();
            ['left', 'right'].forEach(side => {
                const until = p[side === 'left' ? 'leftFreezeUntil' : 'rightFreezeUntil'] || 0;
                const el = document.getElementById(`mfg-detect-${side}`);
                if (el && until > now) el.textContent = `⏳ Chờ ${Math.ceil((until - now) / 1000)} giây`;
            });
        };

        function magicFingerCountRaised(landmarks) {
            if (!landmarks || landmarks.length < 21) return 0;
            // Chỉ tính 4 ngón: trỏ, giữa, áp út, út. Không tính ngón cái.
            const pairs = [[8,6],[12,10],[16,14],[20,18]];
            let count = 0;
            pairs.forEach(([tip, pip]) => {
                if (landmarks[tip].y < landmarks[pip].y - 0.018) count++;
            });
            return count;
        }

        function processMagicFingerDetection(results) {
            const g = ensureMagicFingerState();
            const p = g.play;
            if (!p || p.status !== 'playing') return;

            const sideValues = { left: 0, right: 0 };
            const landmarksArray = results?.landmarks || [];
            landmarksArray.forEach(landmarks => {
                const wrist = landmarks?.[0];
                if (!wrist) return;
                // Giao diện camera được lật gương => đổi trục X để khớp trái/phải trên màn hình.
                const mirroredX = 1 - wrist.x;
                const side = mirroredX < 0.5 ? 'left' : 'right';
                sideValues[side] = Math.max(sideValues[side], magicFingerCountRaised(landmarks));
            });

            ['left', 'right'].forEach(side => {
                const value = sideValues[side];
                const rt = window.magicFingerRuntime.detected[side];
                const el = document.getElementById(`mfg-detect-${side}`);
                const now = Date.now();
                const freezeUntil = p[side === 'left' ? 'leftFreezeUntil' : 'rightFreezeUntil'] || 0;

                if (freezeUntil > now) {
                    if (el) el.textContent = `⏳ Chờ ${Math.ceil((freezeUntil - now) / 1000)} giây`;
                    return;
                }

                if (value === 0) {
                    rt.value = 0;
                    rt.since = now;
                    rt.armed = true;
                    if (el) el.textContent = '✋ Giơ 1–4 ngón tay';
                    return;
                }

                if (rt.value !== value) {
                    rt.value = value;
                    rt.since = now;
                }
                if (el) el.textContent = `Đang nhận: ${value} ngón`;

                const holdMs = Math.max(250, Number(g.settings.holdMs) || 650);
                if (value >= 1 && value <= 4 && rt.armed && now - rt.since >= holdMs) {
                    rt.armed = false;
                    window.submitMagicFingerAnswer(side, value - 1, 'camera');
                }
            });
        }

        function drawMagicFingerCameraHalves(video) {
            if (!video || video.readyState < 2 || !video.videoWidth) return;
            const vw = video.videoWidth, vh = video.videoHeight;
            const half = vw / 2;
            const items = [
                { id: 'mfg-canvas-left', sx: half },
                { id: 'mfg-canvas-right', sx: 0 }
            ];
            items.forEach(item => {
                const canvas = document.getElementById(item.id);
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                const w = Math.max(320, Math.floor(rect.width * Math.min(window.devicePixelRatio || 1, 1.5)));
                const h = Math.max(180, Math.floor(rect.height * Math.min(window.devicePixelRatio || 1, 1.5)));
                if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
                const ctx = canvas.getContext('2d');
                ctx.save();
                ctx.clearRect(0,0,w,h);
                ctx.translate(w, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, item.sx, 0, half, vh, 0, 0, w, h);
                ctx.restore();
            });
        }

        window.toggleMagicFingerFullscreen = function() {
            window.toggleInteractiveGameFullscreen();
        };

        window.attachMagicFingerRuntimeToDOM = function() {
            const rt = window.magicFingerRuntime;
            if (!rt.stream) return;
            const video = document.getElementById('mfg-source-video');
            if (video && video.srcObject !== rt.stream) {
                video.srcObject = rt.stream;
                video.play().catch(() => {});
            }
        };

        window.startMagicFingerCamera = async function() {
            const g = ensureMagicFingerState();
            const p = g.play;
            const rt = window.magicFingerRuntime;
            if (!p || p.status !== 'playing' || rt.cameraStarting) return;
            if (rt.stream && rt.handLandmarker) {
                window.attachMagicFingerRuntimeToDOM();
                return;
            }

            if (!navigator.mediaDevices?.getUserMedia) {
                showToast('Trình duyệt không hỗ trợ camera. Bạn vẫn có thể bấm trực tiếp vào đáp án.', 'error');
                return;
            }

            rt.cameraStarting = true;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                rt.stream = stream;
                window.attachMagicFingerRuntimeToDOM();

                const visionModule = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs');
                const { FilesetResolver, HandLandmarker } = visionModule;
                const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm');
                const options = {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task',
                        delegate: 'GPU'
                    },
                    runningMode: 'VIDEO',
                    numHands: 2,
                    minHandDetectionConfidence: 0.55,
                    minHandPresenceConfidence: 0.55,
                    minTrackingConfidence: 0.55
                };
                try {
                    rt.handLandmarker = await HandLandmarker.createFromOptions(vision, options);
                } catch (gpuErr) {
                    options.baseOptions.delegate = 'CPU';
                    rt.handLandmarker = await HandLandmarker.createFromOptions(vision, options);
                }

                rt.running = true;
                rt.lastVideoTime = -1;
                const loop = () => {
                    if (!rt.running) return;
                    const video = document.getElementById('mfg-source-video');
                    if (video && video.readyState >= 2) {
                        drawMagicFingerCameraHalves(video);
                        const now = performance.now();
                        if (rt.handLandmarker && video.currentTime !== rt.lastVideoTime && now - rt.lastDetectAt > 90) {
                            rt.lastDetectAt = now;
                            rt.lastVideoTime = video.currentTime;
                            try {
                                const result = rt.handLandmarker.detectForVideo(video, now);
                                processMagicFingerDetection(result);
                            } catch (e) {
                                console.warn('Magic Finger detection:', e);
                            }
                        }
                    }
                    rt.raf = requestAnimationFrame(loop);
                };
                if (rt.raf) cancelAnimationFrame(rt.raf);
                rt.raf = requestAnimationFrame(loop);
                showToast('Camera đã sẵn sàng. Giơ 1–4 ngón tay để chọn đáp án!', 'success');
            } catch (err) {
                console.error(err);
                if (rt.stream) rt.stream.getTracks().forEach(t => t.stop());
                rt.stream = null;
                showToast('Không mở được camera. Hãy cấp quyền camera hoặc bấm trực tiếp vào đáp án.', 'error');
            } finally {
                rt.cameraStarting = false;
            }
        };

        window.stopMagicFingerCamera = function(closeDetector = true) {
            const rt = window.magicFingerRuntime;
            rt.running = false;
            if (rt.raf) cancelAnimationFrame(rt.raf);
            rt.raf = null;
            if (rt.stream) rt.stream.getTracks().forEach(t => t.stop());
            rt.stream = null;
            if (closeDetector && rt.handLandmarker) {
                try { rt.handLandmarker.close(); } catch (e) {}
                rt.handLandmarker = null;
            }

                rt.detected[side] = { value: 0, since: 0, armed: true };

        window.startHeadTiltGame = function(){

        window.calibrateHeadTilt=function(){window.headTiltRuntime.baseline=null;window.headTiltRuntime.armed=true;window.headTiltRuntime.directionSince=0;const e=document.getElementById('ht-detect-label');if(e)e.textContent='Nhìn thẳng vào camera để hiệu chỉnh...';};
        window.attachHeadTiltStream=function(){const rt=window.headTiltRuntime,v=document.getElementById('ht-video');if(v&&rt.stream&&v.srcObject!==rt.stream){v.srcObject=rt.stream;v.play().catch(()=>{});}};
        function highlightHeadDirection(dir){const map={up:0,right:1,down:2,left:3};[0,1,2,3].forEach(i=>document.getElementById(`ht-answer-${i}`)?.classList.remove('ring-8','ring-white','scale-[1.03]'));if(map[dir]!==undefined){const e=document.getElementById(`ht-answer-${map[dir]}`);if(e)e.classList.add('ring-8','ring-white','scale-[1.03]');}}
        function processHeadTiltFace(result){
            const g=ensureHeadTiltState(),p=g.play,rt=window.headTiltRuntime;if(!p||p.status!=='playing')return;const face=result?.faceLandmarks?.[0];const label=document.getElementById('ht-detect-label');

        window.startHeadTiltCamera=async function(){

        // =============================================================
        // QUÉT THẺ QR - PHIÊN BẢN CẢ LỚP + ĐIỆN THOẠI
        // - Mỗi học sinh có 1 mã thẻ vĩnh viễn (qrCardId) nằm trong hồ sơ học sinh.
        // - Mỗi học sinh chỉ có 1 QR duy nhất; 4 đáp án A/B/C/D nằm ở 4 cạnh của cùng một thẻ.
        // - Học sinh xoay thẻ để chữ A/B/C/D muốn chọn nằm ở phía trên.

        function ensureStudentQRCardIds() {
            if (!Array.isArray(state.students)) state.students = [];
            state.students.forEach(s => {
                if (!s.code) s.code = generateUniqueCode();
                if (!s.qrCardId) s.qrCardId = `HS-${String(s.code).replace(/\D/g, '') || s.id}`;
            });
        }

        function getStudentQRPayload(student) {
            ensureStudentQRCardIds();
            // V2: mỗi học sinh chỉ có MỘT mã QR cố định.
            // Đáp án A/B/C/D được xác định bằng hướng xoay của cùng một thẻ.
            return `GVCNQR2|${student.qrCardId}`;
        }

        function parseStudentQRPayload(raw) {
            const text = String(raw || '').trim();

            // Thẻ mới: 1 QR / học sinh, đáp án lấy theo hướng xoay.
            let m = text.match(/^GVCNQR2\|([^|]+)$/i);
            if (m) {
                return {
                    version: 2,
                    cardId: m[1],
                    answer: null,
                    answerIndex: -1
                };
            }

            // Tương thích ngược với thẻ V1 cũ (4 QR A/B/C/D) nếu giáo viên còn dùng.
            m = text.match(/^GVCNQR1\|([^|]+)\|([A-D])$/i);
            if (!m) return null;
            const answer = m[2].toUpperCase();
            return {
                version: 1,
                cardId: m[1],
                answer,
                answerIndex: answer.charCodeAt(0) - 65
            };
        }

        function qrAnswerFromOrientation(corners) {
            // Dùng nhiều cạnh của QR để giảm nhiễu phối cảnh khi quét xa.
            // Chỉ chấp nhận hướng khi góc đủ gần 0/90/180/270 độ để tránh chọn nhầm lúc học sinh đang xoay thẻ.
            if (!corners?.topLeft || !corners?.topRight) return null;

            const vectors = [];
            const pushVector = (a, b) => {
                if (!a || !b) return;
                const dx = Number(b.x) - Number(a.x);
                const dy = Number(b.y) - Number(a.y);
                const len = Math.hypot(dx, dy);
                if (Number.isFinite(dx) && Number.isFinite(dy) && len >= 8) {
                    vectors.push({x: dx / len, y: dy / len});
                }
            };
            pushVector(corners.topLeft, corners.topRight);
            pushVector(corners.bottomLeft, corners.bottomRight);
            if (!vectors.length) return null;

            const vx = vectors.reduce((s, v) => s + v.x, 0) / vectors.length;
            const vy = vectors.reduce((s, v) => s + v.y, 0) / vectors.length;
            const angle = Math.atan2(vy, vx) * 180 / Math.PI;
            const nearestQuarter = Math.round(angle / 90) * 90;
            const normalizedDiff = Math.abs(((angle - nearestQuarter + 180) % 360 + 360) % 360 - 180);
            if (normalizedDiff > 34) return null;

            const quarterTurn = ((Math.round(angle / 90) % 4) + 4) % 4;
            // Mẫu thẻ in: A trên, B phải, C dưới, D trái.
            return ['A', 'D', 'C', 'B'][quarterTurn];
        }

            ensureQRQuizState().questions = src.map(q => ({

        function qrClassShuffle(arr) {
            return [...arr].sort(() => Math.random() - 0.5);
        }

        function prepareQRClassRound() {
            const g = ensureQRQuizState();
            const p = g.play;
            if (!p || !p.questions?.length) return;

            if (p.questionIndex >= p.questions.length) {
                p.status = 'finished';
                return;
            }

            const q = p.questions[p.questionIndex];
            p.options = g.settings.shuffleAnswers
                ? qrClassShuffle(q.options.map(o => ({...o})))
                : q.options.map(o => ({...o}));
            p.responses = {};
            p.reveal = false;
            p.timer = Math.max(0, Number(g.settings.timeLimit) || 0);
            p.roundStartedAt = Date.now();

        function qrSound(type) {
            const g = ensureQRQuizState();
            if (!g.settings.soundEnabled || typeof Tone === 'undefined') return;
            try {
                if (Tone.context.state !== 'running') Tone.start();
                const s = new Tone.Synth().toDestination();
                const note = type === 'correct' ? 'G5' : type === 'next' ? 'E5' : type === 'scan' ? 'C5' : 'C3';
                s.triggerAttackRelease(note, '16n');
                setTimeout(() => { try { s.dispose(); } catch(e){} }, 500);
            } catch(e) {}
        }

        function makeQRSessionId() {
            return `QR-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).slice(2,8).toUpperCase()}`;
        }

        // =============================================================
        // BẢN VERCEL/GITHUB: QR GHÉP ĐIỆN THOẠI KHÔNG DÙNG FIREBASE/FIRESTORE
        // =============================================================

        // =============================================================
        // KẾT NỐI QR QUA VERCEL WEBSOCKET - KHÔNG DÙNG FIREBASE/FIRESTORE
        // Máy tính và điện thoại cùng kết nối vào /api/qr-ws trên chính app Vercel.
        // Vercel/Nitro PubSub chuyển dữ liệu trực tiếp theo sessionId.
        // Không lưu phiên chơi vào database; máy tính là nguồn dữ liệu chính.
        // =============================================================

        function getQRCurrentQuestionPayload() {
            const g = ensureQRQuizState();
            const p = g.play;
            if (!p || !p.questions?.length || p.questionIndex >= p.questions.length) return null;
            const q = p.questions[p.questionIndex];
            const correctIndex = Math.max(0, p.options.findIndex(o => o.isCorrect));
            return {
                index: p.questionIndex,
                number: p.questionIndex + 1,
                total: p.questions.length,
                text: q.text,
                options: p.options.map((o,i) => ({
                    letter: String.fromCharCode(65+i),
                    text: o.text
                })),
                correctIndex
            };
        }

        function buildQRSessionDocument() {
            const g = ensureQRQuizState();
            const p = g.play;
            if (!p) return null;
            const roster = (state.students || []).map(s => ({
                id: String(s.id),
                name: s.name || 'Học sinh',
                code: s.code || '',
                cardId: s.qrCardId,
                group: s.group || ''
            }));
            return {
                type: 'GVCN_QR_CLASS_SESSION_V2',
                sessionId: p.sessionId,
                active: p.status === 'playing',
                waitingForPhone: !!p.waitingForPhone,
                title: g.settings.title,
                className: state.admin?.className || 'Lớp học',
                question: getQRCurrentQuestionPayload(),
                roster,
                responses: p.responses || {},
                results: p.results || {},
                scannerStatus: p.phoneStatus || null,
                updatedAt: Date.now()
            };
        }

        function getQRWebSocketUrl(sessionId, role='desktop') {
            const base = getQRScannerBaseUrl();
            if (!base) return '';
            try {
                const u = new URL(base.toString());
                u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
                u.pathname = '/api/qr-ws';
                u.search = '';
                u.hash = '';
                u.searchParams.set('session', sessionId);
                u.searchParams.set('role', role);
                return u.toString();
            } catch(e) {
                return '';
            }
        }

        function qrSocketSend(socket, payload) {
            if (!socket || socket.readyState !== WebSocket.OPEN) return false;
            try {
                socket.send(JSON.stringify(payload));
                return true;
            } catch(e) {
                console.warn('QR WebSocket send:', e);
                return false;
            }
        }

        async function syncQRSessionDocument() {
            const g = ensureQRQuizState();
            const p = g.play;
            if (!p?.sessionId) return false;
            const rt = window.qrQuizRuntime;
            const payload = buildQRSessionDocument();
            if (!payload) return false;
            return qrSocketSend(rt.socket, {
                type: 'session_state',
                data: payload,
                at: Date.now()
            });
        }

        function handleQRDesktopSocketMessage(event) {
            let msg;
            try { msg = JSON.parse(event.data); } catch(e) { return; }
            if (!msg || typeof msg !== 'object') return;

            const g = ensureQRQuizState();
            const p = g.play;
            if (!p || (msg.sessionId && msg.sessionId !== p.sessionId)) return;

            if ((msg.type === 'presence' && msg.role === 'mobile' && msg.action === 'open') ||
                (msg.type === 'hello' && msg.senderRole === 'mobile')) {
                p.phoneStatus = {
                    connected: true,
                    state: 'opened',
                    openedAt: p.phoneStatus?.openedAt || Date.now(),
                    lastSeenAt: Date.now()
                };
                if (window.updateQRPhoneConnectionUI) window.updateQRPhoneConnectionUI(p.phoneStatus);
                syncQRSessionDocument();
                return;
            }

            if (msg.type === 'phone_status' && msg.senderRole === 'mobile') {
                const status = msg.status || {};
                p.phoneStatus = {
                    connected: true,
                    ...status,
                    lastSeenAt: Date.now()
                };
                if (window.updateQRPhoneConnectionUI) window.updateQRPhoneConnectionUI(p.phoneStatus);
                if (window.beginQRDesktopGameplayAfterPhoneReady) {
                    window.beginQRDesktopGameplayAfterPhoneReady(p.phoneStatus);
                }
                syncQRSessionDocument();
                return;
            }

            if (msg.type === 'request_state' && msg.senderRole === 'mobile') {
                syncQRSessionDocument();
                return;
            }

            if (msg.type === 'scan_response' && msg.senderRole === 'mobile') {
                const response = msg.response;
                if (!response?.cardId || !p.questions?.length) return;
                if (Number(msg.questionIndex) !== Number(p.questionIndex)) return;
                p.responses = p.responses || {};
                p.responses[response.cardId] = response;
                p.phoneStatus = {
                    ...(p.phoneStatus || {}),
                    connected: true,
                    state: p.phoneStatus?.state || 'camera',
                    lastSeenAt: Date.now()
                };
                qrSound('scan');
                syncQRSessionDocument();
                if (state.currentTab === 'game-menu' && state.activeGame === 'quet-the-qr') {
                    window.initQRQuizGame();
                }
                return;
            }
        }

        function subscribeQRDesktopSession(sessionId) {
            const rt = window.qrQuizRuntime;

            rt.manualClose = false;
            if (rt.reconnectTimer) {
                clearTimeout(rt.reconnectTimer);
                rt.reconnectTimer = null;
            }
            if (rt.socket) {
                try { rt.socket.onopen = rt.socket.onmessage = rt.socket.onclose = rt.socket.onerror = null; rt.socket.close(); } catch(e){}
                rt.socket = null;
            }

            const wsUrl = getQRWebSocketUrl(sessionId, 'desktop');
            if (!wsUrl) {
                showToast('Không tạo được WebSocket Vercel. Hãy chạy app bằng link HTTPS Vercel.', 'error');
                return false;
            }

            let socket;
            try {
                socket = new WebSocket(wsUrl);
            } catch(e) {
                showToast('Không mở được kết nối Vercel WebSocket.', 'error');
                return false;
            }
            rt.socket = socket;
            rt.sessionId = sessionId;

            socket.addEventListener('open', () => {
                rt.socketConnected = true;
                qrSocketSend(socket, {
                    type: 'hello',
                    role: 'desktop',
                    at: Date.now()
                });
                syncQRSessionDocument();
                const el = document.getElementById('qr-vercel-socket-state');
                if (el) {
                    el.className = 'text-emerald-300 font-black';
                    el.textContent = 'Đã kết nối Vercel';
                }
            });

            socket.addEventListener('message', handleQRDesktopSocketMessage);

            socket.addEventListener('close', () => {
                rt.socketConnected = false;
                if (rt.socket === socket) rt.socket = null;
                const gNow = ensureQRQuizState();
                const pNow = gNow.play;
                if (!rt.manualClose && pNow?.sessionId === sessionId && gNow.view === 'play') {
                    const el = document.getElementById('qr-vercel-socket-state');
                    if (el) {
                        el.className = 'text-amber-300 font-black';
                        el.textContent = 'Đang kết nối lại...';
                    }
                    rt.reconnectTimer = setTimeout(() => subscribeQRDesktopSession(sessionId), 1200);
                }
            });

            socket.addEventListener('error', () => {
                const el = document.getElementById('qr-vercel-socket-state');
                if (el) {
                    el.className = 'text-red-300 font-black';
                    el.textContent = 'Lỗi WebSocket';
                }
            });

            return true;
        }

        function getQRScannerBaseUrl() {
            // Ưu tiên tuyệt đối URL HTTPS đang mở. Khi app được deploy từ GitHub lên Vercel,
            // giáo viên KHÔNG cần nhập link thủ công: QR sẽ tự dùng chính URL Vercel hiện tại.
            try {
                const current = new URL(window.location.href);
                if (current.protocol === 'https:') {
                    current.search = '';
                    current.hash = '';
                    return current;
                }
            } catch(e) {}

            // Chỉ giữ lại cấu hình cũ như phương án tương thích ngược khi đang mở file local.
            const g = ensureQRQuizState();
            const custom = String(g.settings.publicAppUrl || '').trim();
            if (custom) {
                try {
                    const u = new URL(custom);
                    if (u.protocol === 'https:') return u;
                } catch(e) {}
            }
            return null;
        }

        function getQRScannerUrl(sessionId) {
            const url = getQRScannerBaseUrl();
            if (!url) return '';
            url.search = '';
            url.hash = '';
            url.searchParams.set('qrScanSession', sessionId);
            return url.toString();
        }

        function getCurrentQRPhoneLink() {
            const g = ensureQRQuizState();
            return g.play?.sessionId ? getQRScannerUrl(g.play.sessionId) : '';
        }

        window.copyQRPhoneLink = async function() {
            const url = getCurrentQRPhoneLink();
            if (!url) return showToast('Chưa tạo được link điện thoại. Hãy nhập URL HTTPS của app.', 'error');
            try {
                if (navigator.clipboard?.writeText) {
                    await navigator.clipboard.writeText(url);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = url;
                    ta.style.position = 'fixed'; ta.style.opacity = '0';
                    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
                }
                showToast('Đã sao chép link kết nối điện thoại!', 'success');
            } catch(e) {
                showToast('Không sao chép tự động được. Hãy bôi đen link và sao chép thủ công.', 'error');
            }
        };

        window.shareQRPhoneLink = async function() {
            const url = getCurrentQRPhoneLink();
            if (!url) return showToast('Chưa tạo được link điện thoại.', 'error');
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Máy quét QR lớp học',
                        text: 'Mở link này trên điện thoại giáo viên để quét thẻ QR học sinh.',
                        url
                    });
                    return;
                } catch(e) {
                    if (e?.name === 'AbortError') return;
                }
            }
            window.copyQRPhoneLink();
        };

        window.beginQRDesktopGameplayAfterPhoneReady = function(status) {
            const g = ensureQRQuizState();
            const p = g.play;
            if (!p || !p.waitingForPhone) return;

            p.phoneStatus = status;

            // Đồng hồ chỉ bắt đầu khi điện thoại đã mở được camera.

        window.startQRQuizGame = async function() {
            const g = ensureQRQuizState();
            const valid = g.questions.filter(q =>

                q.options.some(o => o.isCorrect)
            );
            if (!valid.length) return showToast('Hãy tạo ít nhất 1 câu hỏi hợp lệ!', 'error');
            if (!(state.students || []).length) return showToast('Lớp chưa có học sinh để tạo thẻ QR!', 'error');

            g.view = 'play';
            g.play = {
                status: 'playing',
                waitingForPhone: true,
                questionIndex: 0,
                questions: g.settings.questionOrder === 'random'
                    ? qrClassShuffle(JSON.parse(JSON.stringify(valid)))
                    : JSON.parse(JSON.stringify(valid)),
                options: [],
                responses: {},
                results: {},
                reveal: false,
                phoneStatus: null,
                sessionId: makeQRSessionId()
            };
            prepareQRClassRound();
            saveData();
            window.initQRQuizGame();

            // Mở fullscreen ngay trong cú click BẮT ĐẦU để trình duyệt cho phép Fullscreen API.
            // Cửa sổ ghép điện thoại sẽ hiển thị bên trong màn hình fullscreen này.
            window.enterInteractiveGameFullscreen();

            // Đồng hồ vẫn chưa chạy cho tới khi điện thoại mở camera thành công.
            if (window.qrQuizRuntime.timerInterval) clearInterval(window.qrQuizRuntime.timerInterval);
            window.qrQuizRuntime.timerInterval = null;

            // Kết nối trực tiếp tới WebSocket của chính app Vercel.
            // Không tạo document Firestore/Cloud cho phiên QR.
            const connected = subscribeQRDesktopSession(g.play.sessionId);
            if (!connected) {
                g.view = 'config';
                g.play = null;
                window.initQRQuizGame();
                return;
            }
            setTimeout(() => window.openQRPhoneConnectModal(), 120);
        };

        window.updateQRQuizTimer = function() {
            const g = ensureQRQuizState();
            const p = g.play;
            if (!p || p.status !== 'playing' || Number(g.settings.timeLimit) <= 0) return;
            p.timer = Math.max(0, p.timer - 1);
            const el = document.getElementById('qrq-timer');
            if (el) el.textContent = `${Math.floor(p.timer/60)}:${String(p.timer%60).padStart(2,'0')}`;
            if (p.timer <= 0) {
                p.reveal = true;
                if (window.qrQuizRuntime.timerInterval) clearInterval(window.qrQuizRuntime.timerInterval);
                window.qrQuizRuntime.timerInterval = null;
                window.initQRQuizGame();
            }
        };

        window.nextQRQuizQuestion = async function() {
            const g = ensureQRQuizState();
            const p = g.play;
            if (!p || p.status !== 'playing') return;

            const correctIndex = p.options.findIndex(o => o.isCorrect);
            Object.values(p.responses || {}).forEach(r => {
                const key = r.cardId;
                const old = p.results[key] || {
                    studentId: r.studentId,
                    studentName: r.studentName,
                    total: 0,
                    correct: 0
                };
                old.total += 1;
                if (Number(r.answerIndex) === correctIndex) old.correct += 1;
                p.results[key] = old;
            });

            p.questionIndex += 1;
            if (p.questionIndex >= p.questions.length) {
                p.status = 'finished';
                if (window.qrQuizRuntime.timerInterval) clearInterval(window.qrQuizRuntime.timerInterval);
                window.qrQuizRuntime.timerInterval = null;
                await syncQRSessionDocument();
                qrSound('next');
                window.initQRQuizGame();
                return;
            }

            prepareQRClassRound();
            if (window.qrQuizRuntime.timerInterval) clearInterval(window.qrQuizRuntime.timerInterval);
            if (Number(g.settings.timeLimit) > 0) {
                window.qrQuizRuntime.timerInterval = setInterval(window.updateQRQuizTimer, 1000);
            }
            await syncQRSessionDocument();
            qrSound('next');
            window.initQRQuizGame();
        };

        function loadExternalScriptOnce(src, globalName) {
            return new Promise((resolve,reject) => {
                if (globalName && window[globalName]) return resolve();
                const old = [...document.scripts].find(s => s.src === src);
                if (old) {
                    if (globalName && window[globalName]) return resolve();
                    old.addEventListener('load', resolve, {once:true});
                    old.addEventListener('error', reject, {once:true});
                    return;
                }
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
            });
        }

        async function createStudentQRDataUrl(student, size = 420) {
            await loadExternalScriptOnce('https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js', 'QRCode');
            const holder = document.createElement('div');
            holder.style.cssText = 'position:fixed;left:-10000px;top:-10000px;width:1px;height:1px;overflow:hidden;background:#fff;';
            document.body.appendChild(holder);
            try {
                new QRCode(holder, {
                    text: getStudentQRPayload(student),
                    width: size,
                    height: size,
                    correctLevel: QRCode.CorrectLevel.H
                });
                await new Promise(r => setTimeout(r, 40));
                const canvas = holder.querySelector('canvas');
                const img = holder.querySelector('img');
                if (canvas) return canvas.toDataURL('image/png');
                if (img?.src) return img.src;
                throw new Error('Không tạo được ảnh QR.');
            } finally {
                holder.remove();
            }
        }

        function drawRotatedCardLabel(ctx, text, x, y, angle, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.fillStyle = color;
            ctx.font = '900 68px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 0, 0);
            ctx.restore();
        }

        async function renderStudentQRCardCanvas(student) {
            const canvas = document.createElement('canvas');
            canvas.width = 900;
            canvas.height = 1220;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#111827';
            ctx.lineWidth = 8;
            ctx.strokeRect(16, 16, canvas.width - 32, canvas.height - 32);

            ctx.fillStyle = '#0f172a';
            ctx.font = '900 44px Arial, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText(String(student.name || 'Học sinh'), 48, 78, 690);

            ctx.fillStyle = '#64748b';
            ctx.font = '700 24px Arial, sans-serif';
            ctx.fillText(`${state.admin?.className || 'Lớp học'} · ID ${student.qrCardId}`, 48, 116, 760);

            const cardX = 100, cardY = 160, cardSize = 700;
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 4;
            ctx.strokeRect(cardX, cardY, cardSize, cardSize);

            drawRotatedCardLabel(ctx, 'A', cardX + cardSize/2, cardY + 58, 0, '#1d4ed8');
            drawRotatedCardLabel(ctx, 'B', cardX + cardSize - 58, cardY + cardSize/2, Math.PI/2, '#e11d48');
            drawRotatedCardLabel(ctx, 'C', cardX + cardSize/2, cardY + cardSize - 58, Math.PI, '#d97706');
            drawRotatedCardLabel(ctx, 'D', cardX + 58, cardY + cardSize/2, -Math.PI/2, '#6d28d9');

            const qrUrl = await createStudentQRDataUrl(student, 520);
            const qrImg = await new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = qrUrl;
            });
            const qrSize = 430;
            const qx = cardX + (cardSize - qrSize)/2;
            const qy = cardY + (cardSize - qrSize)/2;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(qx - 16, qy - 16, qrSize + 32, qrSize + 32);
            ctx.drawImage(qrImg, qx, qy, qrSize, qrSize);

            ctx.fillStyle = '#334155';
            ctx.font = '900 25px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('XOAY CHỮ MUỐN CHỌN LÊN TRÊN', canvas.width/2, 930);
            ctx.font = '700 22px Arial, sans-serif';
            ctx.fillStyle = '#64748b';
            ctx.fillText('1 THẺ QR DUY NHẤT = 4 ĐÁP ÁN A / B / C / D', canvas.width/2, 970);

            ctx.fillStyle = '#f1f5f9';
            ctx.fillRect(48, 1020, canvas.width - 96, 120);
            ctx.fillStyle = '#334155';
            ctx.font = '700 21px Arial, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('Cách dùng:', 72, 1060);
            ctx.font = '600 19px Arial, sans-serif';
            ctx.fillText('Học sinh xoay A, B, C hoặc D lên phía trên rồi giơ thẻ để giáo viên quét.', 72, 1096, 760);
            return canvas;
        }

        window.exportStudentQRCardsPDF = async function() {
            ensureStudentQRCardIds();
            const students = state.students || [];
            if (!students.length) return showToast('Lớp chưa có học sinh để tạo PDF!', 'error');

            const oldCursor = document.body.style.cursor;
            document.body.style.cursor = 'progress';
            document.body.classList.add('pdf-export-busy');
            showToast(`Đang tạo PDF ${students.length} thẻ QR...`, 'success');

            try {
                await loadExternalScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'jspdf');
                const jsPDF = window.jspdf?.jsPDF;
                if (!jsPDF) throw new Error('Không tải được thư viện PDF.');

                const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
                const positions = [
                    {x: 8, y: 8}, {x: 106, y: 8},
                    {x: 8, y: 150}, {x: 106, y: 150}
                ];
                const cardW = 95;
                const cardH = 137;

                for (let i = 0; i < students.length; i++) {
                    if (i > 0 && i % 4 === 0) pdf.addPage();
                    const cardCanvas = await renderStudentQRCardCanvas(students[i]);
                    const dataUrl = cardCanvas.toDataURL('image/jpeg', 0.92);
                    const pos = positions[i % 4];
                    pdf.addImage(dataUrl, 'JPEG', pos.x, pos.y, cardW, cardH, undefined, 'FAST');
                }

                const safeClass = String(state.admin?.className || 'Lop_hoc').replace(/[^a-zA-Z0-9_-]+/g, '_');
                const filename = `The_QR_4_Dap_An_${safeClass}.pdf`;
                const blob = pdf.output('blob');
                const blobUrl = URL.createObjectURL(blob);
                const opened = window.open(blobUrl, '_blank');
                if (!opened) {
                    pdf.save(filename);
                    showToast('Trình duyệt chặn tab PDF nên file đã được tải xuống trực tiếp.', 'success');
                } else {
                    try { opened.document.title = filename; } catch (e) {}
                    showToast('Đã mở file PDF. Bạn có thể xem, in hoặc tải về.', 'success');
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 120000);
                }
                saveData();
            } catch (err) {
                console.error('PDF QR:', err);
                showToast(`Không tạo được PDF: ${err.message || err}`, 'error');
            } finally {
                document.body.style.cursor = oldCursor;
                document.body.classList.remove('pdf-export-busy');
            }
        };

        function connectQRMobileSocket(sessionId) {
            const rt = window.qrMobileRuntime;
            if (rt.reconnectTimer) {
                clearTimeout(rt.reconnectTimer);
                rt.reconnectTimer = null;
            }
            if (rt.socket) {
                try { rt.socket.onopen = rt.socket.onmessage = rt.socket.onclose = rt.socket.onerror = null; rt.socket.close(); } catch(e){}
                rt.socket = null;
            }

            const wsUrl = getQRWebSocketUrl(sessionId, 'mobile');
            const status = document.getElementById('qrm-status');
            if (!wsUrl) {
                if (status) status.innerHTML = '❌ Link này không phải HTTPS Vercel hoặc không tạo được WebSocket.';
                return;
            }

            let socket;
            try { socket = new WebSocket(wsUrl); }
            catch(e) {
                if (status) status.innerHTML = '❌ Không mở được WebSocket Vercel.';
                return;
            }
            rt.socket = socket;

            socket.addEventListener('open', () => {
                if (status) status.innerHTML = '✅ Đã kết nối Vercel · đang nhận câu hỏi từ máy tính...';
                qrSocketSend(socket, { type:'hello', role:'mobile', at:Date.now() });
                qrSocketSend(socket, {
                    type:'phone_status',
                    status:{ connected:true, state:'opened', openedAt:Date.now() },
                    at:Date.now()
                });
                qrSocketSend(socket, { type:'request_state', at:Date.now() });
            });

            socket.addEventListener('message', (event) => {
                let msg;
                try { msg = JSON.parse(event.data); } catch(e) { return; }
                if (!msg || typeof msg !== 'object') return;

                if (msg.type === 'session_state' && msg.senderRole === 'desktop' && msg.data) {
                    rt.session = msg.data;
                    renderQRMobileSession();
                    if (rt.session.active && !rt.stream && !rt.cameraStarting && !rt.autoCameraAttempted) {
                        rt.autoCameraAttempted = true;
                        const s = document.getElementById('qrm-status');
                        if (s) s.innerHTML = '✅ Đã vào phiên. Đang tự mở camera...';
                        setTimeout(() => window.startQRMobileCamera({auto:true}), 120);
                    }
                    return;
                }

                if (msg.type === 'presence' && msg.role === 'desktop' && msg.action === 'open') {
                    qrSocketSend(socket, { type:'request_state', at:Date.now() });
                }
            });

            socket.addEventListener('close', () => {
                if (rt.socket === socket) rt.socket = null;
                const s = document.getElementById('qrm-status');
                if (!rt.manualClose) {
                    if (s) s.innerHTML = '⚠️ Mất kết nối Vercel · đang kết nối lại...';
                    rt.reconnectTimer = setTimeout(() => connectQRMobileSocket(sessionId), 1200);
                }
            });

            socket.addEventListener('error', () => {
                const s = document.getElementById('qrm-status');
                if (s) s.innerHTML = '⚠️ WebSocket Vercel đang lỗi · hệ thống sẽ thử lại.';
            });
        }

        function renderQRMobileSession() {
            const rt = window.qrMobileRuntime;
            const d = rt.session;
            if (!d) return;
            const q = d.question;
            const title = document.getElementById('qrm-title');

        async function tuneQRMobileCameraTrack(track) {
            const rt = window.qrMobileRuntime;
            if (!track || rt.cameraTuned) return;
            rt.track = track;
            try { track.contentHint = 'detail'; } catch (e) {}

            let caps = {};
            try { caps = track.getCapabilities ? track.getCapabilities() : {}; } catch (e) {}
            const applyAdvanced = async (constraint) => {
                try { await track.applyConstraints({ advanced: [constraint] }); } catch (e) {}
            };

            if (Array.isArray(caps.focusMode) && caps.focusMode.includes('continuous')) {
                await applyAdvanced({ focusMode: 'continuous' });
            }
            if (Array.isArray(caps.exposureMode) && caps.exposureMode.includes('continuous')) {
                await applyAdvanced({ exposureMode: 'continuous' });
            }
            if (Array.isArray(caps.whiteBalanceMode) && caps.whiteBalanceMode.includes('continuous')) {
                await applyAdvanced({ whiteBalanceMode: 'continuous' });
            }

            // Zoom nhẹ giúp QR ở xa chiếm nhiều điểm ảnh hơn nhưng vẫn giữ góc quét rộng.
            if (caps.zoom && Number.isFinite(caps.zoom.min) && Number.isFinite(caps.zoom.max) && caps.zoom.max > caps.zoom.min) {
                const preferred = Math.min(caps.zoom.max, Math.max(caps.zoom.min, Math.min(1.25, caps.zoom.max)));
                if (preferred > caps.zoom.min + 0.01) await applyAdvanced({ zoom: preferred });
            }
            rt.cameraTuned = true;
        }

        function qrCornersFromJsQR(code) {
            if (!code?.location) return null;
            return {
                topLeft: code.location.topLeftFinderPattern || code.location.topLeftCorner,
                topRight: code.location.topRightFinderPattern || code.location.topRightCorner,
                bottomLeft: code.location.bottomLeftFinderPattern || code.location.bottomLeftCorner,
                bottomRight: code.location.bottomRightFinderPattern || code.location.bottomRightCorner
            };
        }

        function decodeQRMobileJsQRPass(video, sourceRect, targetWidth, inversionAttempts = 'dontInvert') {
            const rt = window.qrMobileRuntime;
            if (!rt.jsQRReady || !window.jsQR || !video?.videoWidth || !video?.videoHeight) return null;
            if (!rt.canvas) {
                rt.canvas = document.createElement('canvas');
                rt.ctx = rt.canvas.getContext('2d', { willReadFrequently: true, alpha: false });
                if (rt.ctx) rt.ctx.imageSmoothingEnabled = false;
            }
            if (!rt.ctx) return null;

            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const r = sourceRect || { x: 0, y: 0, w: vw, h: vh };
            const safeW = Math.max(64, Math.min(vw - r.x, r.w));
            const safeH = Math.max(64, Math.min(vh - r.y, r.h));
            const outW = Math.max(320, Math.round(Math.min(targetWidth, safeW * 1.6)));
            const outH = Math.max(240, Math.round(outW * safeH / safeW));

            if (rt.canvas.width !== outW || rt.canvas.height !== outH) {
                rt.canvas.width = outW;
                rt.canvas.height = outH;
                rt.ctx.imageSmoothingEnabled = false;
            }
            rt.ctx.drawImage(video, r.x, r.y, safeW, safeH, 0, 0, outW, outH);
            const img = rt.ctx.getImageData(0, 0, outW, outH);
            return window.jsQR(img.data, outW, outH, { inversionAttempts });
        }

        async function decodeQRMobileFrame(video) {
            const rt = window.qrMobileRuntime;
            rt.scanFrame = (rt.scanFrame || 0) + 1;
            let raw = '';
            let orientationCorners = null;
            let detectorBox = null;

            // 1) Ưu tiên BarcodeDetector native khi trình duyệt hỗ trợ: rất nhanh và hữu ích với QR nhỏ ở xa.
            if (rt.detector) {
                try {
                    const codes = await rt.detector.detect(video);
                    const nativeCode = codes?.[0];
                    if (nativeCode?.rawValue) {
                        raw = nativeCode.rawValue;
                        detectorBox = nativeCode.boundingBox || null;
                    }
                } catch (e) {}
            }

            // 2) Nếu native đã tìm thấy QR V2, phóng vùng quanh QR rồi dùng jsQR để lấy hướng chính xác.
            if (raw && rt.jsQRReady) {
                const parsedNative = parseStudentQRPayload(raw);
                if (parsedNative?.version === 2 && detectorBox && video.videoWidth && video.videoHeight) {
                    const padX = detectorBox.width * 0.45;
                    const padY = detectorBox.height * 0.45;
                    const rect = {
                        x: Math.max(0, detectorBox.x - padX),
                        y: Math.max(0, detectorBox.y - padY),
                        w: Math.min(video.videoWidth, detectorBox.width + padX * 2),
                        h: Math.min(video.videoHeight, detectorBox.height + padY * 2)
                    };
                    const targeted = decodeQRMobileJsQRPass(video, rect, 1100, 'dontInvert');
                    if (targeted?.data) {
                        raw = targeted.data;
                        orientationCorners = qrCornersFromJsQR(targeted);
                    }
                }
            }

            // 3) jsQR đa tỉ lệ: quét vùng trung tâm ở độ phân giải cao mỗi frame.
            // Đây là phần giúp đọc thẻ ở xa tốt hơn so với bản cũ chỉ hạ toàn ảnh xuống 720px.
            if ((!raw || (parseStudentQRPayload(raw)?.version === 2 && !orientationCorners)) && rt.jsQRReady) {
                const vw = video.videoWidth || 1280;
                const vh = video.videoHeight || 720;
                const side = Math.max(240, Math.min(vw, vh) * 0.78);
                const centerRect = {
                    x: Math.max(0, (vw - side) / 2),
                    y: Math.max(0, (vh - side) / 2),
                    w: side,
                    h: side
                };
                const cores = Number(navigator.hardwareConcurrency || 4);
                const roiTarget = cores >= 6 ? 1180 : 960;
                const centered = decodeQRMobileJsQRPass(video, centerRect, roiTarget, 'dontInvert');
                if (centered?.data) {
                    raw = centered.data;
                    orientationCorners = qrCornersFromJsQR(centered);
                }
            }

            // 4) Quét toàn khung định kỳ để vẫn nhận QR khi người dùng chưa đưa đúng tâm camera.
            if ((!raw || (parseStudentQRPayload(raw)?.version === 2 && !orientationCorners)) && rt.jsQRReady && rt.scanFrame % 3 === 0) {
                const cores = Number(navigator.hardwareConcurrency || 4);
                const fullTarget = cores >= 6 ? 1280 : 960;
                const full = decodeQRMobileJsQRPass(video, null, fullTarget, 'dontInvert');
                if (full?.data) {
                    raw = full.data;
                    orientationCorners = qrCornersFromJsQR(full);
                }
            }

            // 5) Thử ảnh đảo màu ít thường xuyên hơn để không làm chậm vòng quét chính.
            if ((!raw || (parseStudentQRPayload(raw)?.version === 2 && !orientationCorners)) && rt.jsQRReady && rt.scanFrame % 7 === 0) {
                const vw = video.videoWidth || 1280;
                const vh = video.videoHeight || 720;
                const side = Math.max(240, Math.min(vw, vh) * 0.78);
                const centerRect = { x: Math.max(0, (vw - side) / 2), y: Math.max(0, (vh - side) / 2), w: side, h: side };
                const inverted = decodeQRMobileJsQRPass(video, centerRect, 1000, 'attemptBoth');
                if (inverted?.data) {
                    raw = inverted.data;
                    orientationCorners = qrCornersFromJsQR(inverted);
                }
            }

            return { raw, orientationCorners };
        }

        window.startQRMobileCamera = async function(options = {}) {
            const rt = window.qrMobileRuntime;
            if (rt.cameraStarting || rt.stream) return;
            if (!navigator.mediaDevices?.getUserMedia) {
                return alert('Trình duyệt này không hỗ trợ camera. Hãy mở bằng Chrome/Safari mới và dùng HTTPS.');
            }

            rt.cameraStarting = true;
            rt.cameraTuned = false;
            rt.scanFrame = 0;
            rt.candidateScan = '';
            rt.candidateHits = 0;
            const btn = document.getElementById('qrm-camera-btn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin mr-1"></i> ĐANG TỐI ƯU CAMERA...';
            }

            try {
                rt.stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 30, max: 60 }
                    },
                    audio: false
                });

                const track = rt.stream.getVideoTracks?.()[0] || null;
                if (track) await tuneQRMobileCameraTrack(track);

                const video = document.getElementById('qrm-video');
                if (video) {
                    video.srcObject = rt.stream;
                    await video.play().catch(()=>{});
                }

                // jsQR dùng để đọc hướng xoay của thẻ V2; tải một lần rồi tái sử dụng.
                try {
                    await loadExternalScriptOnce('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js', 'jsQR');
                    rt.jsQRReady = !!window.jsQR;
                } catch (e) {
                    rt.jsQRReady = false;
                }

                // BarcodeDetector native làm lớp nhận diện tốc độ cao khi trình duyệt hỗ trợ.
                if ('BarcodeDetector' in window) {
                    try { rt.detector = new BarcodeDetector({ formats: ['qr_code'] }); }
                    catch(e) { rt.detector = null; }
                }

                rt.running = true;

                qrSocketSend(rt.socket, {
                    type: 'phone_status',
                    status: {
                        connected: true,
                        state: 'camera',
                        openedAt: rt.session?.scannerStatus?.openedAt || Date.now(),
                        cameraAt: Date.now(),
                        lastSeenAt: Date.now()
                    },
                    at: Date.now()
                });

                const status = document.getElementById('qrm-status');
                if (status) status.textContent = 'Camera đã tối ưu lấy nét · đưa thẻ vào vùng sáng, có thể quét từ xa';

                let lastScanTick = 0;
                const loop = async (ts = performance.now()) => {
                    if (!rt.running) return;
                    const v = document.getElementById('qrm-video');
                    // Giới hạn khoảng 20-24 lượt giải mã/giây để giữ máy mát mà vẫn phản hồi gần như tức thì.
                    if (v && v.readyState >= 2 && !rt.detecting && ts - lastScanTick >= 42) {
                        lastScanTick = ts;
                        rt.detecting = true;
                        try {
                            const result = await decodeQRMobileFrame(v);
                            if (result?.raw) await handleQRMobileDecoded(result.raw, result.orientationCorners);
                        } catch(e) {
                            // Bỏ qua lỗi từng frame để camera tiếp tục quét liên tục.
                        } finally {
                            rt.detecting = false;
                        }
                    }
                    rt.raf = requestAnimationFrame(loop);
                };
                rt.raf = requestAnimationFrame(loop);

                if (btn) {
                    btn.innerHTML = '<i class="ph-fill ph-check-circle mr-1"></i> CAMERA ĐANG QUÉT NHANH';
                    btn.className = 'w-full py-4 bg-gradient-to-r from-emerald-500 to-cyan-500 text-white font-black rounded-2xl shadow-lg';
                }
            } catch(err) {
                console.error(err);
                if (rt.stream) rt.stream.getTracks().forEach(t => t.stop());
                rt.stream = null;
                rt.track = null;
                const status = document.getElementById('qrm-status');
                if (status) {
                    status.innerHTML = options?.auto
                        ? '⚠️ Trình duyệt chưa cho tự mở camera. Hãy bấm nút bên dưới một lần và chọn <b>Cho phép camera</b>.'
                        : '❌ Không mở được camera. Hãy cấp quyền camera và đảm bảo trang chạy bằng HTTPS.';
                }
                if (!options?.auto) {
                    alert('Không mở được camera. Hãy cấp quyền camera và đảm bảo trang chạy bằng HTTPS.');
                }
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="ph-fill ph-camera mr-1"></i> CHẠM ĐỂ MỞ CAMERA';
                    btn.className = 'w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-2xl shadow-lg';
                }
            } finally {
                rt.cameraStarting = false;
            }
        };

        async function handleQRMobileDecoded(raw, orientationCorners = null) {
            const rt = window.qrMobileRuntime;
            const parsed = parseStudentQRPayload(raw);
            if (!parsed || !rt.session?.active || !rt.session?.question) return;

            const status = document.getElementById('qrm-status');
            const last = document.getElementById('qrm-last');

            let answer = parsed.answer;
            let answerIndex = parsed.answerIndex;

            if (parsed.version === 2) {
                answer = qrAnswerFromOrientation(orientationCorners);
                if (!answer) {
                    if (status) status.textContent = '↻ Đã thấy thẻ nhưng chưa đọc ổn định hướng. Giữ thẻ thẳng và để chữ muốn chọn ở phía trên.';
                    return;
                }
                answerIndex = answer.charCodeAt(0) - 65;
            }

            const now = Date.now();
            const scanKey = `${parsed.cardId}|${answer}`;

            // Xác nhận bằng 2 lần đọc liên tiếp thay vì chờ cố định 260ms:
            // nhanh hơn rõ rệt nhưng vẫn chống nhảy đáp án khi thẻ đang xoay.
            if (rt.candidateScan !== scanKey || now - rt.candidateSince > 450) {
                rt.candidateScan = scanKey;
                rt.candidateSince = now;
                rt.candidateHits = 1;
                if (status) status.textContent = `Đã bắt được thẻ · đang xác nhận đáp án ${answer}...`;
                return;
            }
            rt.candidateHits = (rt.candidateHits || 1) + 1;
            if (rt.candidateHits < 2 && now - rt.candidateSince < 110) return;

            if (rt.lastScan === scanKey && now - rt.lastScanAt < 900) return;
            rt.lastScan = scanKey;
            rt.lastScanAt = now;
            rt.candidateScan = '';
            rt.candidateHits = 0;

            const student = (rt.session.roster || []).find(s => s.cardId === parsed.cardId);

            if (!student) {
                if (status) status.textContent = '⚠️ Thẻ này không thuộc danh sách lớp hiện tại';
                if (navigator.vibrate) navigator.vibrate([80,60,80]);
                return;
            }

            const q = rt.session.question;
            const response = {
                cardId: parsed.cardId,
                studentId: student.id,
                studentName: student.name,
                answer,
                answerIndex,
                correct: Number(answerIndex) === Number(q.correctIndex),
                at: Date.now()
            };

            try {
                const mergedResponses = {
                    ...(rt.session.responses || {}),
                    [parsed.cardId]: response
                };
                rt.session.responses = mergedResponses;

                const sent = qrSocketSend(rt.socket, {
                    type: 'scan_response',
                    questionIndex: q.index,
                    response,
                    at: Date.now()
                });
                if (!sent) throw new Error('WebSocket Vercel chưa kết nối');

                renderQRMobileSession();
                if (navigator.vibrate) navigator.vibrate(60);
                qrSound('scan');

                if (last) {
                    last.innerHTML = `
                        <div class="text-xs text-slate-400 font-bold">Đã ghi nhận</div>
                        <div class="text-xl font-black mt-1">${mfgEsc(student.name)}</div>
                        <div class="text-5xl font-black text-emerald-400 mt-2">${mfgEsc(answer)}</div>
                        <div class="text-[11px] text-slate-400 mt-1">Giữ chữ ${mfgEsc(answer)} ở phía trên thẻ</div>`;
                }
                if (status) status.textContent = `✅ ${student.name} → ${answer} · tiếp tục quét học sinh khác`;
            } catch(err) {
                console.error(err);
                if (status) status.textContent = '❌ Chưa gửi được kết quả. Đang chờ kết nối Vercel.';
            }
        }
