<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHÀO MỪNG NĂM HỌC MỚI</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                    },
                    colors: { 
                        primary: '#1e1b4b', // Deep indigo
                        secondary: '#312e81', 
                        accent: '#f59e0b', // Amber
                        blueAccent: '#3b82f6', 
                        lightBg: '#f8fafc', 
                        cardBg: '#ffffff' 
                    },
                    animation: { 
                        'fade-in': 'fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
                        'spin-slow': 'spin 8s linear infinite',
                        'bounce-slight': 'bounceSlight 2s infinite ease-in-out'
                    },
                    keyframes: { 
                        fadeIn: { 
                            '0%': { opacity: '0', transform: 'translateY(15px)' }, 
                            '100%': { opacity: '1', transform: 'translateY(0)' } 
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' }, 
                            '100%': { opacity: '1', transform: 'translateY(0)' } 
                        },
                        bounceSlight: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' }
                        }
                    },
                    letterSpacing: {
                        tighter: '-0.04em',
                        tight: '-0.02em',
                        normal: '0',
                        wide: '0.02em',
                        wider: '0.05em',
                        widest: '0.1em',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; 
            color: #0f172a; 
            margin: 0; 
            height: 100vh; 
            overflow: hidden; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Custom Scrollbar for a premium look */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Toast Notifications */
        .toast { 
            position: fixed; bottom: 24px; right: 24px; 
            padding: 16px 24px; border-radius: 16px; 
            color: white; font-weight: 700; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.15); 
            display: flex; align-items: center; gap: 12px; 
            z-index: 1000; 
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        .toast.success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .toast.error { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .toast.fadeOut { animation: fadeOutRight 0.3s ease-in forwards; }
        
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        /* Typography refinements */
        h1, h2, h3, h4, h5, h6 {
            letter-spacing: -0.02em;
        }
        
        .tracking-widest {
            letter-spacing: 0.1em;
        }

        /* Banner effects */
        .bg-banner { position: relative; overflow: hidden; }
        .bg-banner::before { 
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; 
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%); 
            animation: spin 40s linear infinite; pointer-events: none; 
        }
        
        /* Glassmorphism utilities */
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .glass-dark { background: rgba(30, 27, 75, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }

        /* Print adjustments */
        @media print {
            body * { visibility: hidden; }
            #report-container, #report-container * { visibility: visible; }
            #report-container { position: absolute; left: 0; top: 0; width: 100%; max-width: 100%; }
            .custom-scrollbar { overflow: visible !important; max-height: none !important; }
            .print\:hidden { display: none !important; }
        }

        /* Fullscreen styles for Game - Separated for cross-browser compatibility */
        #game-mount-point:fullscreen,
        #keoco-game-container:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            border-radius: 0 !important;
            border: none !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            z-index: 99999 !important;
            background-color: #121118 !important;
        }

        #game-mount-point:-webkit-full-screen,
        #keoco-game-container:-webkit-full-screen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            border-radius: 0 !important;
            border: none !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            z-index: 99999 !important;
            background-color: #121118 !important;
        }

        #game-mount-point.fixed-fullscreen,
        #keoco-game-container.fixed-fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            border-radius: 0 !important;
            border: none !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            z-index: 99999 !important;
            background-color: #121118 !important;
        }

        /* Khi thu nhỏ khỏi Fullscreen, màn chơi vẫn giữ đủ chức năng và có thể cuộn. */
        #game-mount-point:not(:fullscreen):not(.fixed-fullscreen) {
            align-items: flex-start !important;
            justify-content: flex-start !important;
            overflow: auto !important;
        }
        #game-mount-point:not(:fullscreen):not(.fixed-fullscreen) .interactive-game-play-shell {
            width: 100% !important;
            height: auto !important;
            min-height: 650px !important;
            max-height: none !important;
            flex: 0 0 auto !important;
        }
        #game-mount-point:fullscreen .interactive-game-play-shell,
        #game-mount-point:-webkit-full-screen .interactive-game-play-shell,
        #game-mount-point.fixed-fullscreen .interactive-game-play-shell {
            width: 100vw !important;
            height: 100vh !important;
            min-height: 100vh !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
        }

        /* PDF viewer mở ở tab mới; không làm ảnh hưởng màn chơi hiện tại. */
        .pdf-export-busy { cursor: progress !important; }


        /* ============================================================
           GIAO DIỆN TƯƠI SÁNG 2026 - CHỈ CSS, KHÔNG ĐỔI CẤU TRÚC APP
           ============================================================ */
        :root {
            --ui-indigo: #4f46e5;
            --ui-violet: #7c3aed;
            --ui-cyan: #06b6d4;
            --ui-emerald: #10b981;
            --ui-amber: #f59e0b;
            --ui-pink: #ec4899;
            --ui-surface: rgba(255,255,255,.92);
            --ui-border: rgba(99,102,241,.12);
            --ui-shadow: 0 14px 38px rgba(79,70,229,.10), 0 3px 12px rgba(15,23,42,.05);
        }

        body {
            background:
                radial-gradient(circle at 8% 8%, rgba(56,189,248,.18), transparent 30%),
                radial-gradient(circle at 92% 12%, rgba(244,114,182,.14), transparent 28%),
                radial-gradient(circle at 82% 88%, rgba(52,211,153,.14), transparent 30%),
                linear-gradient(135deg, #f8fbff 0%, #f7f4ff 48%, #f1fbf8 100%) !important;
        }

        #app { background: transparent !important; }
        #main-container { background: transparent !important; }
        #main-content {
            background:
                radial-gradient(circle at 12% 8%, rgba(14,165,233,.08), transparent 26%),
                radial-gradient(circle at 88% 8%, rgba(168,85,247,.08), transparent 28%),
                linear-gradient(180deg, rgba(255,255,255,.42), rgba(248,250,252,.78));
        }

        aside {
            background:
                radial-gradient(circle at 30% 0%, rgba(56,189,248,.24), transparent 28%),
                radial-gradient(circle at 90% 80%, rgba(244,114,182,.16), transparent 30%),
                linear-gradient(165deg, #312e81 0%, #4338ca 44%, #5b21b6 100%) !important;
            border-color: rgba(255,255,255,.14) !important;
            box-shadow: 12px 0 42px rgba(67,56,202,.14) !important;
        }

        header.glass {
            background: rgba(255,255,255,.86) !important;
            border-bottom: 1px solid rgba(99,102,241,.10) !important;
            box-shadow: 0 8px 30px rgba(79,70,229,.07) !important;
            backdrop-filter: blur(18px) saturate(1.18) !important;
            -webkit-backdrop-filter: blur(18px) saturate(1.18) !important;
        }

        .glass {
            background: rgba(255,255,255,.84) !important;
            border-color: rgba(99,102,241,.10) !important;
            backdrop-filter: blur(16px) saturate(1.12) !important;
            -webkit-backdrop-filter: blur(16px) saturate(1.12) !important;
        }

        #main-content .bg-white {
            box-shadow: var(--ui-shadow);
            border-color: var(--ui-border) !important;
        }

        #main-content button,
        header button,
        aside button {
            transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease, border-color .18s ease, opacity .18s ease !important;
        }
        #main-content button:not(:disabled):hover,
        header button:not(:disabled):hover {
            transform: translateY(-1px);
        }
        #main-content button:not(:disabled):active,
        header button:not(:disabled):active,
        aside button:not(:disabled):active {
            transform: translateY(0) scale(.985);
        }

        input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
        select,
        textarea {
            background: rgba(255,255,255,.94) !important;
            border-color: rgba(148,163,184,.42) !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 4px 12px rgba(79,70,229,.035);
            transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease !important;
        }
        input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):focus,
        select:focus,
        textarea:focus {
            border-color: rgba(99,102,241,.72) !important;
            box-shadow: 0 0 0 4px rgba(99,102,241,.10), 0 8px 20px rgba(79,70,229,.06) !important;
            outline: none !important;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #a5b4fc, #67e8f9) !important;
            border-radius: 999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #818cf8, #22d3ee) !important;
        }

        .toast {
            border: 1px solid rgba(255,255,255,.26);
            box-shadow: 0 18px 44px rgba(15,23,42,.20) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .toast.success { background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%) !important; }
        .toast.error { background: linear-gradient(135deg, #ef4444 0%, #f97316 100%) !important; }

        #game-mount-point:not(:fullscreen):not(.fixed-fullscreen) {
            border: 1px solid rgba(99,102,241,.12) !important;
            box-shadow: 0 18px 50px rgba(79,70,229,.10) !important;
        }

        /* Máy quét điện thoại: sáng, rõ vùng quét nhưng vẫn giữ nền tối để camera dễ quan sát. */
        #qrm-question {
            border: 1px solid rgba(16,185,129,.20) !important;
            box-shadow: 0 14px 34px rgba(16,185,129,.10) !important;
        }
        #qrm-video {
            filter: saturate(1.06) contrast(1.04) brightness(1.01);
        }
        #qrm-status {
            background: rgba(2,6,23,.78) !important;
            border: 1px solid rgba(110,231,183,.30);
            box-shadow: 0 10px 28px rgba(0,0,0,.28);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        #qrm-last {
            background: linear-gradient(135deg, rgba(6,78,59,.82), rgba(8,47,73,.82)) !important;
            border-color: rgba(103,232,249,.22) !important;
            box-shadow: 0 12px 28px rgba(6,78,59,.18);
        }
        #qrm-camera-btn {
            box-shadow: 0 12px 28px rgba(16,185,129,.22) !important;
        }

        @media (max-width: 768px) {
            #main-content { background: linear-gradient(180deg, #f8fbff, #f7f5ff 55%, #f3fbf7) !important; }
            .toast { left: 12px; right: 12px; bottom: 12px; }
        }


        /* =========================================================
           ĐUA VỊT - SÂN ĐUA MẶT NƯỚC (giao diện theo ảnh tham khảo)
           Chỉ thay phần trình bày/trải nghiệm của Đua Vịt.
           ========================================================= */
        .duck-race-shell {
            position: relative;
            min-height: 72vh;
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(180deg, #68c7ff 0%, #7ce7e5 100%);
            box-shadow: 0 20px 55px rgba(2,132,199,.22);
            border: 1px solid rgba(255,255,255,.72);
        }
        .duck-water {
            position: relative;
            min-height: clamp(560px, 72vh, 820px);
            overflow: hidden;
            background:
                radial-gradient(ellipse at 8% 26%, rgba(255,255,255,.12) 0 2%, transparent 2.5%),
                radial-gradient(ellipse at 72% 58%, rgba(255,255,255,.10) 0 2.5%, transparent 3%),
                radial-gradient(ellipse at 30% 74%, rgba(255,255,255,.08) 0 2%, transparent 2.6%),
                linear-gradient(180deg, #1596ef 0%, #1689e4 45%, #1378d2 100%);
        }
        .duck-water::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(176deg,
                    transparent 0 17px,
                    rgba(255,255,255,.13) 18px 19px,
                    transparent 20px 34px),
                repeating-linear-gradient(184deg,
                    transparent 0 32px,
                    rgba(3,105,161,.16) 33px 34px,
                    transparent 35px 61px);
            opacity: .72;
            mix-blend-mode: screen;
        }
        .duck-water::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(ellipse 54px 10px at 13% 18%, rgba(255,255,255,.10) 0 45%, transparent 48%),
                radial-gradient(ellipse 70px 12px at 43% 42%, rgba(255,255,255,.08) 0 46%, transparent 49%),
                radial-gradient(ellipse 62px 11px at 82% 72%, rgba(255,255,255,.08) 0 46%, transparent 49%),
                radial-gradient(ellipse 50px 9px at 61% 84%, rgba(3,105,161,.10) 0 45%, transparent 48%);
        }
        .duck-bank {
            position: absolute;
            left: 0;
            right: 0;
            height: 30px;
            z-index: 35;
            background:
                linear-gradient(180deg, #7a481f 0 56%, #613715 57% 100%);
            box-shadow: inset 0 3px 0 rgba(255,255,255,.12), 0 4px 12px rgba(30,64,175,.15);
        }
        .duck-bank.top { top: 0; }
        .duck-bank.bottom { bottom: 0; transform: rotate(180deg); }
        .duck-bank::after {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 20px; height: 12px;
            background:
                repeating-linear-gradient(125deg,
                    #6dbb36 0 7px,
                    #3f9d32 7px 13px,
                    #8acb42 13px 19px);
            clip-path: polygon(0 30%, 2% 0, 4% 45%, 6% 4%, 8% 46%, 10% 2%, 12% 45%, 14% 0, 16% 48%, 18% 3%, 20% 45%, 22% 0, 24% 48%, 26% 2%, 28% 45%, 30% 0, 32% 48%, 34% 2%, 36% 45%, 38% 0, 40% 48%, 42% 2%, 44% 45%, 46% 0, 48% 48%, 50% 2%, 52% 45%, 54% 0, 56% 48%, 58% 2%, 60% 45%, 62% 0, 64% 48%, 66% 2%, 68% 45%, 70% 0, 72% 48%, 74% 2%, 76% 45%, 78% 0, 80% 48%, 82% 2%, 84% 45%, 86% 0, 88% 48%, 90% 2%, 92% 45%, 94% 0, 96% 48%, 98% 2%, 100% 45%, 100% 100%, 0 100%);
        }
        .duck-start-line {
            position: absolute;
            top: 30px;
            bottom: 30px;
            left: 8.5%;
            width: 5px;
            z-index: 24;
            transform: translateX(-50%);
            border-radius: 999px;
            background: repeating-linear-gradient(0deg, rgba(255,255,255,.98) 0 12px, rgba(14,116,144,.65) 12px 22px);
            box-shadow: 0 0 0 2px rgba(255,255,255,.28), 0 4px 14px rgba(3,105,161,.22);
        }
        .duck-start-line::before {
            content: 'XUẤT PHÁT';
            position: absolute;
            top: 10px;
            left: 10px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            color: rgba(255,255,255,.95);
            font-size: 9px;
            font-weight: 900;
            letter-spacing: .12em;
            text-shadow: 0 2px 4px rgba(3,71,104,.65);
        }
        .duck-finish-line {
            position: absolute;
            top: 30px;
            bottom: 30px;
            left: 90%;
            width: 22px;
            z-index: 25;
            transform: translateX(-50%);
            border-left: 2px solid rgba(255,255,255,.85);
            border-right: 2px solid rgba(15,23,42,.45);
            background-color: #fff;
            background-image:
                linear-gradient(45deg, #0f172a 25%, transparent 25%),
                linear-gradient(-45deg, #0f172a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #0f172a 75%),
                linear-gradient(-45deg, transparent 75%, #0f172a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0;
            box-shadow: 0 0 0 1px rgba(255,255,255,.55), 0 6px 18px rgba(15,23,42,.22);
        }
        .duck-finish-line::before {
            content: '🏁';
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,.22));
        }
        .duck-racer {
            position: absolute;
            z-index: 30;
            width: 104px;
            height: 74px;
            will-change: transform;
            transform: translate3d(0,0,0);
            user-select: none;
        }
        .duck-racer-inner {
            position: relative;
            width: 74px;
            height: 50px;
            margin: 0 auto;
            --duck-scale: 1;
            transform: scale(var(--duck-scale));
            transform-origin: 50% 65%;
            filter: drop-shadow(0 4px 3px rgba(3,72,120,.23));
        }
        .duck-racer.racing .duck-racer-inner { animation: duckBob .38s ease-in-out infinite alternate; }
        .duck-water.duck-mid .duck-racer-inner { --duck-scale: .82; }
        .duck-water.duck-mid .duck-racer-label { top: 42px; font-size: 10px; max-width: 108px; }
        .duck-water.duck-dense .duck-racer-inner { --duck-scale: .66; }
        .duck-water.duck-dense .duck-racer-label { top: 34px; font-size: 9px; max-width: 88px; padding: 1px 4px; }
        .duck-racer-label {
            position: absolute;
            top: 49px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 126px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 2px 6px;
            color: #fff;
            font-weight: 900;
            font-size: 12px;
            line-height: 1.2;
            text-shadow: 0 2px 3px rgba(3,54,93,.82), 0 0 5px rgba(3,54,93,.65);
        }
        .duck-accessory {
            position: absolute;
            z-index: 5;
            top: -17px;
            left: 25px;
            font-size: 19px;
            transform: rotate(-7deg);
            filter: drop-shadow(0 2px 1px rgba(0,0,0,.22));
        }
        .duck-race-toolbar {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            z-index: 60;
            pointer-events: none;
        }
        .duck-race-toolbar button { pointer-events: auto; }
        .duck-race-fab {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 65;
            width: 74px;
            height: 74px;
            border-radius: 22px;
            background: linear-gradient(150deg, #7c3aed, #5b21b6);
            color: white;
            font-weight: 900;
            box-shadow: 0 14px 30px rgba(91,33,182,.34), inset 0 1px 0 rgba(255,255,255,.25);
            border: 1px solid rgba(255,255,255,.32);
        }
        .duck-race-fab:hover { transform: translateY(-50%) scale(1.05); }
        .duck-race-result-pill {
            position: absolute;
            left: 50%;
            top: 10px;
            transform: translateX(-50%);
            z-index: 58;
            max-width: min(680px, 58vw);
            border-radius: 999px;
            background: rgba(255,255,255,.90);
            border: 1px solid rgba(255,255,255,.92);
            box-shadow: 0 8px 22px rgba(3,105,161,.18);
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
        }
        .duck-ranking-panel {
            position: absolute;
            right: 14px;
            top: 54px;
            z-index: 70;
            width: 250px;
            max-height: 65%;
            overflow-y: auto;
            background: rgba(255,255,255,.94);
            border: 1px solid rgba(255,255,255,.95);
            border-radius: 18px;
            box-shadow: 0 16px 38px rgba(2,80,130,.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        @keyframes duckBob {
            from { transform: scale(var(--duck-scale, 1)) translateY(-2px) rotate(-2deg); }

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.initCloud = async function() {
            document.getElementById('app').innerHTML = `
                <div class="flex h-full w-full flex-col items-center justify-center gap-6 bg-slate-50">
                    <div class="relative w-20 h-20">
                        <div class="absolute inset-0 border-4 border-blue-200 rounded-full"></div>
                        <div class="absolute inset-0 border-4 border-blueAccent border-t-transparent rounded-full animate-spin"></div>
                    </div>
                    <div class="text-xl font-bold text-slate-700 animate-pulse tracking-wide">Đang tải hệ thống...</div>
                </div>`;
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'chuyen-tau-3B-v2';
                let firebaseConfig = null;
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    try { firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config; } catch (e) {}
                }
                
                if (!firebaseConfig) {
                    window.useCloud = false; if(window.startApp) window.startApp(); return;
                }
                
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app); const db = getFirestore(app);
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
                
                window.cloudUser = auth.currentUser; window.cloudDb = db; window.cloudAppId = appId; 
                window.cloudDoc = doc; window.cloudSetDoc = setDoc; window.cloudOnSnapshot = onSnapshot; 
                window.useCloud = true;
                if(window.startApp) window.startApp();
            } catch (e) {
                console.warn("Cloud Sync not available, falling back to LocalStorage."); 
                window.useCloud = false; if(window.startApp) window.startApp();
            }
        };
        setTimeout(() => window.initCloud(), 50);
    </script>

        function escapeInlineJs(str) { return str ? String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '\\r') : ''; }
        function escapeHtmlAttr(str) { return str ? String(str).replace(/"/g, '&quot;') : ''; }
        
        function generateUniqueCode() {
            let code, attempts = 0;
            const currentStudents = state.students || [];
            do { code = Math.floor(10000 + Math.random() * 90000).toString(); attempts++; } while (currentStudents.some(s => s.code === code) && attempts < 100);
            return code;
        }

        function compressImage(file, callback, max_size = 300, quality = 0.8) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } } 
                    else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality)); 
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.startApp = function() {
            // Chế độ máy quét QR trên điện thoại: mở bằng QR phiên chơi, không tải giao diện quản lý lớp.
            const qrMobileSession = new URLSearchParams(window.location.search).get('qrScanSession');
            if (qrMobileSession) {
                isDataLoaded = true;
                if (window.startQRMobileScanner) {
                    window.startQRMobileScanner(qrMobileSession);
                } else {
                    setTimeout(() => window.startQRMobileScanner && window.startQRMobileScanner(qrMobileSession), 80);
                }
                return;
            }

            if (window.useCloud && window.cloudDb && window.cloudUser) {
                const docRef = window.cloudDoc(window.cloudDb, 'artifacts', window.cloudAppId, 'users', window.cloudUser.uid, 'classData', 'main');
                window.cloudOnSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const parsed = docSnap.data().state;
                        state = { ...state, ...parsed };
                        applyStateDefaults();
                        if (!isDataLoaded) { isDataLoaded = true; renderLayout(); showToast("Đã đồng bộ Dữ liệu Đám mây!", "success"); } else { renderLayout(); }
                    } else {
                        fallbackLoad(true);
                    }
                }, (error) => { fallbackLoad(); });
            } else { fallbackLoad(); }
        }

        function fallbackLoad(isFirstCloudSync = false) {
            try {
                const savedData = localStorage.getItem('chuyen_tau_data');
                if (savedData) { state = { ...state, ...JSON.parse(savedData) }; applyStateDefaults(); } 
                else { initDefaultStudents(); applyStateDefaults(); saveData(); }
            } catch (err) { initDefaultStudents(); applyStateDefaults(); saveData(); }
            isDataLoaded = true; 
            renderLayout();

        }

        async function saveData() { 
            if (window.useCloud && window.cloudDb && window.cloudUser) {
                try {
                    const docRef = window.cloudDoc(window.cloudDb, 'artifacts', window.cloudAppId, 'users', window.cloudUser.uid, 'classData', 'main');
                    await window.cloudSetDoc(docRef, { state: state });
                } catch (e) { localStorage.setItem('chuyen_tau_data', JSON.stringify(state)); }
            } else { localStorage.setItem('chuyen_tau_data', JSON.stringify(state)); }

            if (!state.attendanceStudentNotes) state.attendanceStudentNotes = {};

            if (!state.students) state.students = [];
            
            const defaultRewards = [

                { id: 'r3', name: 'Miễn làm bài tập', cost: 50, icon: 'ph-files', color: 'text-emerald-600', bg: 'bg-emerald-100', desc: 'Miễn 1 bài tập về nhà' },

            state.students.forEach(s => {

        async function readGameAiResponse(response) {
            let data = null;
            try { data = await response.json(); }
            catch { data = null; }
            if (!response.ok) {
                const msg = data?.error?.message || data?.error || data?.message || `Lỗi AI (${response.status})`;
                const error = new Error(msg);
                error.status = response.status;
                throw error;
            }
            return data || {};
        }

        // Gọi Vercel Function /api/gemini. Nếu đang mở file HTML local và route không tồn tại,
        // app sẽ fallback gọi trực tiếp Gemini để giáo viên vẫn có thể thử nghiệm.
        async function callGameGeminiApi(payload, apiKey = getGameGeminiApiKey()) {
            if (!apiKey) throw new Error('Chưa nhập Google Gemini API Key.');
            try {
                const response = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-gemini-api-key': apiKey
                    },
                    body: JSON.stringify(payload)
                });
                if (response.status !== 404) return await readGameAiResponse(response);
            } catch (err) {
                // Nếu server đã trả lỗi thật (401/403/429/5xx), không che mất thông báo đó.
                if (err?.status && err.status !== 404) throw err;
                console.warn('Không gọi được /api/gemini, thử Gemini trực tiếp:', err);
            }
            return callGeminiDirectFallback(payload, apiKey);
        }

        async function callGeminiDirectFallback(payload, apiKey) {
            const model = getGameGeminiModel() || GAME_GEMINI_MODEL;
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;

            if (payload.action === 'validate') {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: 'Chỉ trả lời: OK' }] }],
                        generationConfig: { maxOutputTokens: 12 }
                    })
                });
                const data = await readGameAiResponse(response);
                return { ok: true, model, direct: true, raw: data };
            }

            if (payload.action !== 'generate') throw new Error('Yêu cầu AI không hợp lệ.');
            const count = Math.max(1, Math.min(20, Number(payload.count) || 5));
            const prompt = buildClientQuizPrompt(payload.topic, count, payload.grade, payload.difficulty, payload.homeroomClass);
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseMimeType: 'application/json',
                        responseJsonSchema: buildClientQuizSchema(count),
                        maxOutputTokens: Math.max(1000, count * 240),
                        thinkingConfig: { thinkingLevel: model === 'gemini-3.7-flash' ? 'low' : 'minimal' }
                    }
                })
            });
            const data = await readGameAiResponse(response);
            const raw = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
            let parsed;
            try { parsed = JSON.parse(raw.replace(/```json/gi, '').replace(/```/g, '').trim()); }
            catch { throw new Error('Gemini trả về dữ liệu không đọc được. Hãy thử lại.'); }
            return { ok: true, model, direct: true, questions: normalizeAiQuestionPayload(parsed, count) };
        }

        function inferHomeroomGrade() {
            const className = String(state?.admin?.className || '').trim();
            const normalized = className.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            const match = normalized.match(/(?:lop\s*)?([1-5])(?:\D|$)/i);
            return match ? `Lớp ${match[1]}` : 'Lớp 3';
        }

        function buildClientQuizPrompt(topic, count, grade = 'Tiểu học', difficulty = 'Vừa', homeroomClass = '') {
            const classContext = String(homeroomClass || state?.admin?.className || '').trim();
            return `Bạn là giáo viên chủ nhiệm tiểu học Việt Nam. Tạo đúng ${count} câu hỏi trắc nghiệm cho ${grade || 'Tiểu học'}${classContext ? ` (lớp chủ nhiệm: ${classContext})` : ''}, chủ đề: "${String(topic || '').trim()}". Mức độ: ${difficulty || 'Vừa'}.
Yêu cầu bắt buộc: mỗi câu có đúng 4 lựa chọn, chỉ 1 đáp án đúng; câu hỏi ngắn, rõ, dùng từ phù hợp lứa tuổi; đáp án nhiễu hợp lý nhưng không đánh đố; không lặp câu; không tạo kiến thức vượt quá khối lớp; không dùng thông tin thời sự dễ thay đổi. Tự kiểm tra đáp án đúng trước khi xuất. Chỉ trả JSON theo schema.`;
        }

        function buildClientQuizSchema(count) {
            return {
                type: 'array',
                minItems: count,
                maxItems: count,
                items: {
                    type: 'object',
                    properties: {
                        text: { type: 'string' },
                        options: { type: 'array', minItems: 4, maxItems: 4, items: { type: 'string' } },
                        correctIndex: { type: 'integer', minimum: 0, maximum: 3 }
                    },
                    required: ['text', 'options', 'correctIndex'],
                    additionalProperties: false
                }
            };
        }

        function normalizeAiQuestionPayload(parsed, count) {
            if (!Array.isArray(parsed) || parsed.length === 0) throw new Error('AI chưa tạo được câu hỏi hợp lệ.');
            return parsed.slice(0, count).map((q, idx) => {
                const opts = Array.isArray(q.options) ? q.options.slice(0, 4).map(v => String(v ?? '').trim()) : [];
                while (opts.length < 4) opts.push(`Lựa chọn ${opts.length + 1}`);
                let correctIndex = Number(q.correctIndex);
                if (!Number.isInteger(correctIndex) || correctIndex < 0 || correctIndex > 3) correctIndex = 0;
                return {
                    text: String(q.text || `Câu hỏi ${idx + 1}`).trim(),
                    options: opts,
                    correctIndex
                };
            });
        }

                                <div><b>AI sẽ đưa câu hỏi vào Thư viện trước.</b><div class="text-xs text-violet-600 mt-1">Sau khi tạo xong, bạn tích chọn những câu muốn dùng rồi bấm “Đưa các câu đã chọn vào bộ câu hỏi”.</div></div>
                            </div>
                            <button id="game-ai-generate-btn" onclick="generateGameAIQuestions('${targetGame}')" class="w-full py-3.5 bg-gradient-to-r from-fuchsia-600 to-indigo-600 hover:from-fuchsia-700 hover:to-indigo-700 text-white font-black rounded-xl shadow-lg flex items-center justify-center gap-2"><i class="ph-fill ph-sparkle text-lg"></i> TẠO CÂU HỎI NGAY</button>
                            <div class="text-[11px] text-slate-500 text-center">API: ${mfgEsc(maskGameApiKey(getGameGeminiApiKey()))} · Model: <b>${mfgEsc(getGameGeminiModel())}</b></div>
                        </div>
                    </div>
                </div>`;
        };

        function applyAIQuestionsToGame(targetGame, questions) {
            const clones = (questions || []).map((q, idx) => ({
                id: Date.now() + idx + Math.random(),
                text: String(q.text || '').trim(),
                options: (q.options || []).map(o => ({ text: String(o.text || '').trim(), isCorrect: !!o.isCorrect }))
            }));
            if (!clones.length) return;

            if (targetGame === 'keo-co-kien') {
                if (!state.keoCoGame) return;
                if (!Array.isArray(state.keoCoGame.questionLibrary)) state.keoCoGame.questionLibrary = [];
                state.keoCoGame.questionLibrary.push(...clones);
                if (window.initKeoCoKien) window.initKeoCoKien();
                setTimeout(() => { if (window.openKeoCoLibraryModal) window.openKeoCoLibraryModal(); }, 30);
                return;
            }

            let g = null;
            let initFn = null;
            if (targetGame === 'ngon-tay-than-ky') { g = ensureMagicFingerState(); initFn = window.initMagicFingerGame; }
            else if (targetGame === 'quizz-nghieng-dau') { g = ensureHeadTiltState(); initFn = window.initHeadTiltGame; }
            else if (targetGame === 'quet-the-qr') { g = ensureQRQuizState(); initFn = window.initQRQuizGame; }
            if (!g) return;

            if (!Array.isArray(g.questionLibrary)) g.questionLibrary = [];
            g.questionLibrary.push(...clones);
            if (typeof initFn === 'function') initFn();
            setTimeout(() => window.openGameQuestionLibrary(targetGame), 30);
        }

        window.generateGameAIQuestions = async function(targetGame) {
            const topic = document.getElementById('game-ai-topic')?.value.trim();
            const count = Number(document.getElementById('game-ai-count')?.value || 5);
            const grade = document.getElementById('game-ai-grade')?.value || 'Lớp 3';
            const difficulty = document.getElementById('game-ai-difficulty')?.value || 'Vừa';
            if (!topic) return showToast('Vui lòng nhập môn học/chủ đề!', 'error');
            const btn = document.getElementById('game-ai-generate-btn');
            const old = btn?.innerHTML;
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-lg"></i> AI đang tạo câu hỏi...'; }
            try {
                const questions = await generateQuizQuestionsWithGemini({ topic, count, grade, difficulty });
                document.getElementById('modal-container').innerHTML = '';
                applyAIQuestionsToGame(targetGame, questions);
                saveData();
                showToast(`AI đã tạo ${questions.length} câu và đưa vào Thư viện!`, 'success');
            } catch (err) {
                console.error('Game AI:', err);
                let message = err.message || 'Không tạo được câu hỏi.';
                if (/API_KEY_INVALID|API key not valid|invalid api key/i.test(message)) message = 'API Key không hợp lệ. Hãy vào nút Gemini API để nhập lại.';
                else if (/quota|RESOURCE_EXHAUSTED|429/i.test(message)) message = 'Gemini API đã hết quota tạm thời. Hãy thử lại sau hoặc kiểm tra hạn mức.';
                showToast(`Không tạo được câu hỏi: ${message}`, 'error');
            } finally {
                if (btn && document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = old || 'TẠO CÂU HỎI NGAY'; }
            }
        };


        // =============================================================
        // THƯ VIỆN CÂU HỎI DÙNG CHUNG - NGÓN TAY / NGHIÊNG ĐẦU / QUÉT QR
        // AI tạo câu hỏi vào thư viện trước, giáo viên chọn câu để đưa vào bộ thi đấu.
        // =============================================================
        function getInteractiveQuestionLibraryState(gameId) {
            if (gameId === 'ngon-tay-than-ky') return ensureMagicFingerState();
            if (gameId === 'quizz-nghieng-dau') return ensureHeadTiltState();
            if (gameId === 'quet-the-qr') return ensureQRQuizState();
            return null;
        }

        function getInteractiveQuestionLibraryMeta(gameId) {
            if (gameId === 'ngon-tay-than-ky') return { name: 'Ngón Tay Thần Kỳ', icon: 'ph-hand-pointing' };
            if (gameId === 'quizz-nghieng-dau') return { name: 'Quizz Nghiêng Đầu', icon: 'ph-smiley-wink' };
            return { name: 'Quét Thẻ QR', icon: 'ph-qr-code' };
        }

        function rerenderInteractiveQuestionGame(gameId) {
            if (gameId === 'ngon-tay-than-ky' && window.initMagicFingerGame) window.initMagicFingerGame();
            else if (gameId === 'quizz-nghieng-dau' && window.initHeadTiltGame) window.initHeadTiltGame();
            else if (gameId === 'quet-the-qr' && window.initQRQuizGame) window.initQRQuizGame();
        }

        window.openGameQuestionLibrary = function(gameId) {
            const g = getInteractiveQuestionLibraryState(gameId);
            if (!g) return;
            if (!Array.isArray(g.questionLibrary)) g.questionLibrary = [];
            const library = g.questionLibrary;
            const meta = getInteractiveQuestionLibraryMeta(gameId);
            const cards = library.map((q, idx) => `
                <div class="p-4 bg-white rounded-2xl border border-slate-200 hover:border-blue-400 transition-all flex items-start gap-3 shadow-sm group">
                    <input type="checkbox" value="${mfgEsc(q.id)}" class="game-lib-q-check w-5 h-5 accent-blue-600 cursor-pointer mt-1 rounded">
                    <div class="flex-1 min-w-0 text-left">
                        <div class="font-bold text-slate-800 text-sm mb-2 break-words">${idx + 1}. ${mfgEsc(q.text)}</div>
                        <div class="flex flex-wrap gap-1.5">
                            ${(q.options || []).map((o, oi) => `<span class="px-2 py-1 rounded-lg text-xs font-semibold ${o.isCorrect ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-500 border border-slate-200'}"><b class="mr-1">${String.fromCharCode(65 + oi)}.</b>${mfgEsc(o.text)}</span>`).join('')}
                        </div>
                    </div>
                    <button onclick="deleteGameLibraryQuestion('${gameId}','${mfgEsc(q.id)}')" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="Xóa câu hỏi"><i class="ph-bold ph-trash"></i></button>
                </div>
            `).join('');

            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-slate-950/70 z-[240] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" id="interactive-library-modal">
                    <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-3xl overflow-hidden flex flex-col max-h-[88vh] border border-blue-100">
                        <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-600 text-white p-6 flex justify-between items-center">
                            <div>
                                <div class="text-xs font-bold text-blue-100 mb-1 flex items-center gap-1.5"><i class="ph-fill ${meta.icon}"></i> ${meta.name}</div>
                                <h3 class="font-black text-xl md:text-2xl flex items-center gap-2"><i class="ph-fill ph-books text-2xl"></i> THƯ VIỆN CÂU HỎI (${library.length} câu)</h3>
                                <p class="text-xs text-blue-100 mt-1">Tích chọn các câu hỏi bạn muốn đưa vào bộ câu hỏi thi đấu</p>
                            </div>
                            <button onclick="closeModal('interactive-library-modal')" class="w-10 h-10 bg-white/10 p-2 rounded-full hover:bg-white/20 transition-colors"><i class="ph-bold ph-x text-xl"></i></button>
                        </div>

                        <div class="p-4 bg-slate-50 border-b border-slate-200 flex flex-wrap justify-between items-center gap-3 text-xs font-bold text-slate-600">
                            <div class="flex flex-wrap items-center gap-3">
                                <button onclick="toggleSelectAllGameLibrary(true)" class="text-blue-600 hover:underline"><i class="ph-bold ph-check-square"></i> Chọn tất cả</button>
                                <button onclick="toggleSelectAllGameLibrary(false)" class="text-slate-500 hover:underline"><i class="ph-bold ph-square"></i> Bỏ chọn</button>
                                <button onclick="deleteAllGameLibraryQuestions('${gameId}')" class="text-red-600 hover:text-red-700 hover:underline"><i class="ph-bold ph-trash"></i> Xóa tất cả</button>
                            </div>
                            <button onclick="openGameAIGeneratorModal('${gameId}')" class="px-4 py-2 bg-gradient-to-r from-fuchsia-600 to-violet-600 text-white rounded-xl hover:shadow-md flex items-center gap-1.5"><i class="ph-fill ph-sparkle"></i> Tạo thêm bằng AI</button>
                        </div>

                        <div class="p-5 md:p-6 bg-slate-50 space-y-3 overflow-y-auto custom-scrollbar flex-1 min-h-[240px]">
                            ${library.length ? cards : `<div class="h-full min-h-[230px] flex flex-col items-center justify-center text-center text-slate-400 px-4"><i class="ph-duotone ph-books text-6xl text-slate-300 mb-3"></i><div class="font-black text-lg text-slate-500">Thư viện đang trống</div><div class="text-sm italic mt-1">Bấm “Tạo thêm bằng AI” để tạo câu hỏi, sau đó chọn các câu muốn sử dụng.</div></div>`}
                        </div>

                        <div class="p-4 bg-white border-t border-slate-200 flex flex-col sm:flex-row justify-between gap-3 items-center">
                            <button onclick="closeModal('interactive-library-modal')" class="w-full sm:w-auto px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs transition-colors">Đóng</button>
                            <button onclick="addSelectedGameLibraryQuestions('${gameId}')" class="w-full sm:w-auto px-7 py-3 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl text-xs transition-all shadow-md flex items-center justify-center gap-2">
                                <i class="ph-bold ph-plus-circle text-base"></i> ĐƯA CÁC CÂU ĐÃ CHỌN VÀO BỘ CÂU HỎI
                            </button>
                        </div>
                    </div>
                </div>`;
        };

        window.toggleSelectAllGameLibrary = function(select) {
            document.querySelectorAll('.game-lib-q-check').forEach(cb => cb.checked = !!select);
        };

        window.deleteGameLibraryQuestion = function(gameId, questionId) {
            const g = getInteractiveQuestionLibraryState(gameId);
            if (!g) return;
            g.questionLibrary = (g.questionLibrary || []).filter(q => String(q.id) !== String(questionId));
            saveData();
            window.openGameQuestionLibrary(gameId);
            rerenderInteractiveQuestionGame(gameId);
            showToast('Đã xóa câu hỏi khỏi thư viện!', 'success');
        };

        window.deleteAllGameLibraryQuestions = function(gameId) {
            const g = getInteractiveQuestionLibraryState(gameId);
            if (!g || !(g.questionLibrary || []).length) return showToast('Thư viện đang trống!', 'error');
            if (!confirm(`Xóa toàn bộ ${g.questionLibrary.length} câu hỏi trong thư viện? Thao tác này không thể hoàn tác.`)) return;
            g.questionLibrary = [];
            saveData();
            window.openGameQuestionLibrary(gameId);
            rerenderInteractiveQuestionGame(gameId);
            showToast('Đã xóa tất cả câu hỏi trong thư viện!', 'success');
        };

        window.addSelectedGameLibraryQuestions = function(gameId) {
            const g = getInteractiveQuestionLibraryState(gameId);
            if (!g) return;
            const ids = [...document.querySelectorAll('.game-lib-q-check:checked')].map(cb => String(cb.value));
            if (!ids.length) return showToast('Vui lòng chọn ít nhất 1 câu hỏi từ thư viện!', 'error');
            const chosen = (g.questionLibrary || []).filter(q => ids.includes(String(q.id)));
            const added = chosen.map((q, idx) => ({
                id: Date.now() + idx + Math.random(),
                text: q.text,
                options: JSON.parse(JSON.stringify(q.options || []))
            }));
            if (!Array.isArray(g.questions)) g.questions = [];
            g.questions.push(...added);
            closeModal('interactive-library-modal');
            saveData();
            rerenderInteractiveQuestionGame(gameId);
            showToast(`Đã đưa ${added.length} câu hỏi vào Bộ câu hỏi!`, 'success');
        };

        window.activeGameLoop = null; // Biến lưu vòng lặp của game canvas (nếu có)

        // =============================================================
        // TOÀN MÀN HÌNH DÙNG CHUNG CHO CÁC TRÒ CHƠI TƯƠNG TÁC
        // Ưu tiên Fullscreen API; nếu trình duyệt chặn thì dùng fixed-fullscreen.
        // =============================================================
        window.isInteractiveGameFullscreen = function() {
            const elem = document.getElementById('game-mount-point');
            if (!elem) return false;
            const native = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            return !!native || elem.classList.contains('fixed-fullscreen');
        };

        window.updateInteractiveGameFullscreenButtons = function() {
            const isFull = window.isInteractiveGameFullscreen();
            document.querySelectorAll('[data-interactive-fullscreen-btn]').forEach(btn => {
                btn.title = isFull ? 'Thu màn hình' : 'Mở toàn màn hình';
                btn.setAttribute('aria-label', btn.title);
                const icon = btn.querySelector('[data-fullscreen-icon]');
                if (icon) icon.className = `ph-bold ${isFull ? 'ph-corners-in' : 'ph-corners-out'}`;
                const label = btn.querySelector('[data-fullscreen-label]');
                if (label) label.textContent = isFull ? 'THU NHỎ' : 'TOÀN MÀN';
            });
        };

        window.enterInteractiveGameFullscreen = function() {
            const elem = document.getElementById('game-mount-point');
            if (!elem) return;
            const isNativeFS = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            if (isNativeFS) { window.updateInteractiveGameFullscreenButtons(); return; }

            try {
                let request = null;
                if (elem.requestFullscreen) request = elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); setTimeout(window.updateInteractiveGameFullscreenButtons, 80); return; }
                else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); setTimeout(window.updateInteractiveGameFullscreenButtons, 80); return; }
                else { elem.classList.add('fixed-fullscreen'); window.updateInteractiveGameFullscreenButtons(); return; }

                if (request && typeof request.catch === 'function') {
                    request.catch(() => { elem.classList.add('fixed-fullscreen'); window.updateInteractiveGameFullscreenButtons(); });
                }
            } catch (e) {
                elem.classList.add('fixed-fullscreen');
                window.updateInteractiveGameFullscreenButtons();
            }
            setTimeout(window.updateInteractiveGameFullscreenButtons, 100);
        };

        window.exitInteractiveGameFullscreen = function() {
            const elem = document.getElementById('game-mount-point');
            if (elem) elem.classList.remove('fixed-fullscreen');

            const isNativeFS = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            if (!isNativeFS) { window.updateInteractiveGameFullscreenButtons(); return; }
            try {
                if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            } catch (e) {}
            setTimeout(window.updateInteractiveGameFullscreenButtons, 100);
        };

        window.toggleInteractiveGameFullscreen = function() {
            if (window.isInteractiveGameFullscreen()) window.exitInteractiveGameFullscreen();
            else window.enterInteractiveGameFullscreen();
        };

        ['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(evt => {
            document.addEventListener(evt, () => setTimeout(window.updateInteractiveGameFullscreenButtons, 0));
        });

        window.cleanupCurrentGame = function(nextGameId = null) {
            const current = state.activeGame;
            if (current === 'ngon-tay-than-ky' && current !== nextGameId && window.cleanupMagicFingerGame) window.cleanupMagicFingerGame(true);
            if (current === 'quizz-nghieng-dau' && current !== nextGameId && window.cleanupHeadTiltGame) window.cleanupHeadTiltGame(true);
            if (current === 'quet-the-qr' && current !== nextGameId && window.cleanupQRQuizGame) window.cleanupQRQuizGame(true);
        };

        window.switchGame = function(gameId) {
            window.cleanupCurrentGame(gameId);
            state.activeGame = gameId;
            if (window.activeGameLoop) {
                cancelAnimationFrame(window.activeGameLoop);
                window.activeGameLoop = null;
            }
            renderLayout();
            setTimeout(() => {
                if (gameId === 'tictactoe') window.initTicTacToe();
                else if (gameId === 'memory') window.initMemoryGame();
                else if (gameId === 'catch') window.initCatchGame();
                else if (gameId === 'keo-co-kien') window.initKeoCoKien();
                else if (gameId === 'ngon-tay-than-ky') window.initMagicFingerGame();
                else if (gameId === 'quizz-nghieng-dau') window.initHeadTiltGame();
                else if (gameId === 'quet-the-qr') window.initQRQuizGame();
            }, 50);
        };

        // =============================================================
        // NGÓN TAY THẦN KỲ - CUỘC ĐUA NGÔI SAO
        // Nhận diện 1-4 ngón tay bằng MediaPipe Hand Landmarker.
        // Hai người chơi đứng ở hai nửa khung hình camera và giơ 1-4 ngón
        // (không tính ngón cái) để chọn đáp án tương ứng.
        // =============================================================
        window.magicFingerRuntime = window.magicFingerRuntime || {
            stream: null,
            handLandmarker: null,
            raf: null,
            timerInterval: null,
            lastDetectAt: 0,
            lastVideoTime: -1,
            running: false,
            cameraStarting: false,
            detected: {
                left:  { value: 0, since: 0, armed: true },
                right: { value: 0, since: 0, armed: true }
            }
        };

        function mfgEsc(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function ensureMagicFingerState() {
            if (!state.magicFingerGame) {
                state.magicFingerGame = {
                    view: 'config',
                    settings: {
                        title: 'Cuộc Đua Ngôi Sao',
                        timeLimit: 90,
                        starsToWin: 6,
                        wrongFreeze: 2,
                        holdMs: 650,
                        team1Name: 'Người chơi bên trái',
                        team2Name: 'Người chơi bên phải',
                        questionOrder: 'random',
                        shuffleAnswers: true,
                        cameraEnabled: true,
                        soundEnabled: true
                    },
                    questions: [
                        {
                            id: 1,
                            text: 'Thủ đô của Việt Nam là thành phố nào?',
                            options: [
                                { text: 'TP. Hồ Chí Minh', isCorrect: false },
                                { text: 'Hà Nội', isCorrect: true },
                                { text: 'Đà Nẵng', isCorrect: false },
                                { text: 'Huế', isCorrect: false }
                            ]
                        },
                        {
                            id: 2,
                            text: '5 × 6 bằng bao nhiêu?',
                            options: [
                                { text: '25', isCorrect: false },
                                { text: '30', isCorrect: true },
                                { text: '35', isCorrect: false },
                                { text: '40', isCorrect: false }
                            ]
                        },
                        {
                            id: 3,
                            text: 'Từ nào dưới đây chỉ hoạt động?',
                            options: [
                                { text: 'Chạy', isCorrect: true },
                                { text: 'Đẹp', isCorrect: false },
                                { text: 'Cao', isCorrect: false },
                                { text: 'Xanh', isCorrect: false }
                            ]
                        }
                    ],
                    questionLibrary: [],
                    play: null
                };
            }

            const g = state.magicFingerGame;
            if (!g.settings) g.settings = {};
            const defaults = {
                title: 'Cuộc Đua Ngôi Sao', timeLimit: 90, starsToWin: 6,
                wrongFreeze: 2, holdMs: 650,
                team1Name: 'Người chơi bên trái', team2Name: 'Người chơi bên phải',
                questionOrder: 'random', shuffleAnswers: true,
                cameraEnabled: true, soundEnabled: true
            };
            Object.keys(defaults).forEach(k => {
                if (typeof g.settings[k] === 'undefined') g.settings[k] = defaults[k];
            });
            if (!Array.isArray(g.questions)) g.questions = [];
            if (!Array.isArray(g.questionLibrary)) g.questionLibrary = [];
            return g;
        }

        function magicFingerShuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function prepareMagicFingerRound() {
            const g = ensureMagicFingerState();
            const p = g.play;
            if (!p || !Array.isArray(p.questions) || p.questions.length === 0) return;

            if (p.questionIndex >= p.questions.length) {
                p.questionIndex = 0;
                if (g.settings.questionOrder === 'random') p.questions = magicFingerShuffle(p.questions);
            }

            const q = p.questions[p.questionIndex];
            const left = q.options.map(o => ({ ...o }));
            const right = q.options.map(o => ({ ...o }));
            p.leftOptions = g.settings.shuffleAnswers ? magicFingerShuffle(left) : left;
            p.rightOptions = g.settings.shuffleAnswers ? magicFingerShuffle(right) : right;
            p.roundLocked = false;
            p.leftFreezeUntil = 0;
            p.rightFreezeUntil = 0;
            p.roundMessage = '';

            const rt = window.magicFingerRuntime;
            rt.detected.left = { value: 0, since: 0, armed: true };
            rt.detected.right = { value: 0, since: 0, armed: true };
        }

        window.updateMagicFingerSetting = function(key, value, type = 'string') {
            const g = ensureMagicFingerState();
            if (type === 'number') value = Number(value);
            if (type === 'boolean') value = !!value;
            g.settings[key] = value;
        };

        window.updateMagicFingerQuestion = function(qIndex, field, value, optionIndex = null) {
            const g = ensureMagicFingerState();
            const q = g.questions[qIndex];
            if (!q) return;
            if (field === 'text') q.text = value;
            if (field === 'option' && optionIndex !== null && q.options[optionIndex]) q.options[optionIndex].text = value;
            if (field === 'correct') {
                const correctIndex = Number(value);
                q.options.forEach((o, i) => o.isCorrect = i === correctIndex);
            }
        };

        window.addMagicFingerQuestion = function() {
            const g = ensureMagicFingerState();
            g.questions.push({
                id: Date.now() + Math.random(),
                text: 'Câu hỏi mới',
                options: [
                    { text: 'Đáp án 1', isCorrect: true },
                    { text: 'Đáp án 2', isCorrect: false },
                    { text: 'Đáp án 3', isCorrect: false },
                    { text: 'Đáp án 4', isCorrect: false }
                ]
            });
            window.initMagicFingerGame();
        };

        window.deleteMagicFingerQuestion = function(index) {
            const g = ensureMagicFingerState();
            if (g.questions.length <= 1) return showToast('Cần ít nhất 1 câu hỏi!', 'error');
            g.questions.splice(index, 1);
            window.initMagicFingerGame();
        };

        window.importMagicFingerFromKeoCo = function() {
            const g = ensureMagicFingerState();
            const source = state.keoCoGame?.questions?.filter(q => !q.isDeleted) || [];
            if (!source.length) return showToast('Kéo Co Kiến chưa có câu hỏi khả dụng!', 'error');
            g.questions = source.map(q => ({
                id: Date.now() + Math.random(),
                text: q.text,
                options: q.options.map(o => ({ text: o.text, isCorrect: !!o.isCorrect }))
            }));
            window.initMagicFingerGame();
            showToast(`Đã lấy ${g.questions.length} câu hỏi từ Kéo Co Kiến!`, 'success');
