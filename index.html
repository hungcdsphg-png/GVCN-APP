                        <div class="flex flex-wrap justify-center gap-8 px-4 max-h-[60vh] overflow-y-auto custom-scrollbar">${htmlContent}</div>
                    </div>
                </div>
            `;
            setTimeout(() => {
                const canvas = document.getElementById('modal-confetti-canvas'); if (!canvas) return;
                canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
                const ctx = canvas.getContext('2d');
                const particles = [], colors = ['#3b82f6', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6'];
                for (let i = 0; i < 150; i++) particles.push({ x: canvas.width/2, y: canvas.height/2+50, r: Math.random()*6+3, dx: Math.random()*16-8, dy: Math.random()*-15-8, color: colors[Math.floor(Math.random()*colors.length)], tilt: Math.floor(Math.random()*10)-10, tiltAngleInc: (Math.random()*0.07)+0.05, tiltAngle: 0 });
                function render() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height); let active = 0;
                    particles.forEach(p => {
                        if (p.y < canvas.height) active++;
                        p.tiltAngle += p.tiltAngleInc; p.y += (Math.cos(p.tiltAngle) + p.dy + p.r/2)/2; p.x += Math.sin(p.tiltAngle)*2 + p.dx; p.dy += 0.25;
                        ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color; ctx.moveTo(p.x+p.tilt+p.r, p.y); ctx.lineTo(p.x+p.tilt, p.y+p.tilt+p.r); ctx.stroke();
                    });
                    if (active > 0) requestAnimationFrame(render); else ctx.clearRect(0, 0, canvas.width, canvas.height);
                } render();
            }, 100);
        }

            state.students.forEach(s => {

        function performParentLookup() {
            const code = document.getElementById('lookup-code-input').value.trim();

            const student = state.students.find(s => s.code === code);
            if (student) showParentView(student.id); else showToast("Mã tra cứu không chính xác!", "error");
        }

                                <div class="relative cursor-pointer group mb-2" onclick="document.getElementById('edit-theme-banner-upload').click()">
                                    <div id="banner-preview-container" class="w-full h-36 rounded-2xl bg-slate-100 flex items-center justify-center shadow-inner overflow-hidden border-2 border-dashed border-slate-300 group-hover:border-blueAccent transition-colors relative">
                                        ${state.theme.bannerUrl ? `<img src="${state.theme.bannerUrl}" class="w-full h-full object-cover">` : `<div class="flex flex-col items-center gap-2"><i class="ph-fill ph-image text-4xl text-slate-300"></i><span class="text-xs font-bold text-slate-400">Bấm để chọn ảnh</span></div>`}
                                    </div>
                                    <input type="file" id="edit-theme-banner-upload" class="hidden" accept="image/*" onchange="handleBannerUpload(event)">
                                </div>
                                <input type="text" id="edit-theme-banner" value="${escapeHtmlAttr(state.theme.bannerUrl || '')}" class="hidden">
                                ${state.theme.bannerUrl ? `<button onclick="document.getElementById('edit-theme-banner').value=''; document.getElementById('banner-preview-container').innerHTML='<div class=\\'flex flex-col items-center gap-2\\'><i class=\\'ph-fill ph-image text-4xl text-slate-300\\'></i><span class=\\'text-xs font-bold text-slate-400\\'>Bấm để chọn ảnh</span></div>'; this.style.display='none';" class="text-[11px] text-red-500 font-bold bg-red-50 px-3 py-1.5 rounded-lg border border-red-100">Xóa ảnh và dùng màu nền</button>` : ''}
                            </div>
                        </div>
                        <div class="p-6 bg-white border-t border-slate-200"><button onclick="saveThemeEdit()" class="w-full py-4 bg-primary text-white font-black rounded-xl hover:bg-secondary shadow-lg hover:-translate-y-0.5 transition-all tracking-wide">CẬP NHẬT GIAO DIỆN</button></div>
                    </div>
                </div>
            `;
        }

        function handleBannerUpload(e) {
            const file = e.target.files[0]; if (!file) return;
            compressImage(file, (dataUrl) => {
                document.getElementById('edit-theme-banner').value = dataUrl;
                const preview = document.getElementById('banner-preview-container');
                if (preview) preview.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover rounded-2xl"><div class="absolute inset-0 bg-black/50 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><i class="ph-bold ph-upload-simple text-white text-3xl mb-2"></i><span class="text-white text-sm font-bold">Thay ảnh khác</span></div>`;
            }, 1200, 0.8);
        }

        function saveThemeEdit() {
            state.theme.month = document.getElementById('edit-theme-month').value.trim();
            state.theme.title = document.getElementById('edit-theme-title').value.trim();
            state.theme.bannerUrl = document.getElementById('edit-theme-banner').value.trim();
            state.theme.bannerColorClass = document.getElementById('edit-theme-color').value.trim();
            saveData(); closeModal('edit-theme-modal'); renderLayout(); showToast("Đã cập nhật giao diện tổng quan!");
        }

        /* --- TÍNH NĂNG XEM LỊCH SỬ HỌC SINH --- */
        window.openStudentHistoryModal = function(id) {
            const student = state.students.find(s => s.id === id);
            if (!student) return;

            const history = student.history || [];
            // Sắp xếp lịch sử mới nhất lên đầu
            const sortedHistory = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));

            let historyHtml = '';
            if (sortedHistory.length === 0) {
                historyHtml = `
                    <div class="text-center py-12 flex flex-col items-center justify-center border-2 border-dashed border-slate-200 rounded-3xl bg-white/50">
                        <i class="ph-fill ph-clock-dashed text-6xl text-slate-300 mb-3"></i>
                        <div class="text-slate-500 font-bold text-lg">Chưa có dữ liệu</div>
                        <p class="text-sm text-slate-400 mt-1">Học sinh chưa có lịch sử cộng/trừ điểm nào.</p>
                    </div>`;
            } else {
                historyHtml = sortedHistory.map(h => {
                    const dateObj = new Date(h.date);
                    const dateStr = `${String(dateObj.getDate()).padStart(2, '0')}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/${dateObj.getFullYear()}`;
                    const timeStr = `${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
                    const isPositive = h.points > 0;
                    
                    const colorTheme = isPositive 
                        ? { bg: 'bg-emerald-50', text: 'text-emerald-600', border: 'border-emerald-200', icon: 'ph-trend-up', sign: '+' } 
                        : { bg: 'bg-red-50', text: 'text-red-600', border: 'border-red-200', icon: 'ph-trend-down', sign: '' };

                    return `
                        <div class="flex gap-5 items-start relative pb-6 group">
                            <!-- Đường viền dọc nối các sự kiện -->
                            <div class="absolute top-10 left-[23px] bottom-0 w-[2px] bg-slate-200 group-last:bg-transparent"></div>
                            
                            <!-- Icon -->
                            <div class="w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0 z-10 shadow-sm border ${colorTheme.border} ${colorTheme.bg} ${colorTheme.text}">
                                <i class="ph-bold ${colorTheme.icon} text-xl"></i>
                            </div>
                            
                            <!-- Nội dung -->
                            <div class="flex-1 bg-white p-4 md:p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all hover:-translate-y-1">
                                <div class="flex justify-between items-start gap-4 mb-2">
                                    <div class="font-bold text-slate-800 text-base leading-tight">${h.reason}</div>
                                    <div class="font-black text-xl flex-shrink-0 ${colorTheme.text} bg-white px-2 py-0.5 rounded-lg border ${colorTheme.border} shadow-sm">${colorTheme.sign}${h.points}</div>
                                </div>
                                <div class="text-[11px] font-bold text-slate-400 flex items-center gap-1.5 uppercase tracking-wider">
                                    <i class="ph-fill ph-clock"></i> ${timeStr} <span class="mx-1">•</span> <i class="ph-fill ph-calendar-blank"></i> ${dateStr}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            const modalHtml = `
                <div class="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" id="history-student-modal">
                    <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="bg-primary text-white p-6 flex justify-between items-center px-8 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiNmZmYiLz48L3N2Zz4=')]"></div>
                            <h3 class="font-black text-xl flex items-center gap-3 relative z-10"><i class="ph-fill ph-clock-counter-clockwise text-accent text-2xl"></i> LỊCH SỬ THI ĐUA</h3>
                            <button onclick="closeModal('history-student-modal')" class="text-white hover:text-red-400 bg-white/10 hover:bg-white/20 p-2.5 rounded-full transition-colors relative z-10"><i class="ph-bold ph-x text-lg"></i></button>
                        </div>
                        
                        <!-- Header / Profile -->
                        <div class="px-8 py-6 border-b border-slate-200 bg-white flex items-center justify-between gap-4 shadow-sm z-10 relative">
                            <div class="flex items-center gap-5">
                                ${getAvatarImg(student.avatarUrl, student.name, "w-16 h-16 ring-4 ring-slate-50 shadow-md")}
                                <div>
                                    <div class="font-black text-slate-800 text-2xl tracking-tight mb-1">${student.name}</div>
                                    <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest bg-slate-100 px-3 py-1 rounded-lg inline-block border border-slate-200">${student.group}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">TỔNG ĐIỂM HIỆN TẠI</div>
                                <div class="text-3xl font-black text-blueAccent">${student.points}</div>
                            </div>
                        </div>

                        <!-- Timeline -->
                        <div class="p-6 md:p-8 flex-1 overflow-y-auto custom-scrollbar bg-slate-50 relative">
                            ${historyHtml}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = modalHtml;
        };
    </script>
</body>
</html>
